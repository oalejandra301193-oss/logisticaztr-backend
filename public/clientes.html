<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Clientes</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h2>👤 Clientes</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res=await fetch("https://logisticaztr-backend.onrender.com/trips/clientes")
const clientes=await res.json()

let html=""

clientes.forEach(c=>{

html+=`

<div class="card">

Nombre: ${c.nombre || "-"}

<br>

CUIT: ${c.cuit || "-"}

<br>

Telefono: ${c.telefono || "-"}

<br>

Direccion comercial: ${c.direccion || "-"}

<br>

Viajes: ${c.viajes || 0}

</div>

`

})

document.getElementById("lista").innerHTML=html

}

cargar()

</script>

</body>

</html>
