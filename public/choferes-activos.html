<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Choferes activos</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px;}
.card{background:#1e293b;padding:15px;margin-bottom:10px;border-radius:10px;}
</style>
</head>

<body>

<h2>🟢 Choferes activos</h2>
<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("/trips")
const viajes = await res.json()

let html=""

viajes.forEach(v=>{

if(v.estado === "EN_VIAJE"){

html+=`
<div class="card">
👨‍✈️ ${v.chofer?.nombre || "-"}<br>
🚛 ${v.producto}
</div>
`

}

})

document.getElementById("lista").innerHTML=html

}

cargar()

</script>

</body>
</html>
