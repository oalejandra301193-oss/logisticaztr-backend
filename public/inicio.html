<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Logistica ZTR</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<link rel="manifest" href="/manifest.json">

<style>

body{
margin:0;
height:100vh;
font-family:Arial;
background:linear-gradient(120deg,#1f2937,#111827);
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.card{
text-align:center;
padding:60px;
background:rgba(255,255,255,0.05);
border-radius:15px;
backdrop-filter:blur(10px);
}

h1{
font-size:60px;
margin-bottom:20px;
}

button{
padding:15px 40px;
font-size:20px;
background:#22c55e;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
margin:10px;
}

button:hover{
background:#16a34a;
}

#instalarApp{
display:none;
}

</style>

</head>

<body>

<div class="card">

<h1>🚚 Logistica ZTR</h1>

<p>Sistema de gestión de cargas</p>

<br>

<button onclick="window.location='/panel.html'">
Entrar al panel
</button>

<button id="instalarApp">
Instalar App
</button>

</div>

<script>

if("serviceWorker" in navigator){
navigator.serviceWorker.register("/sw.js")
}

let deferredPrompt

window.addEventListener("beforeinstallprompt",(e)=>{

e.preventDefault()

deferredPrompt=e

document.getElementById("instalarApp").style.display="block"

})

document.getElementById("instalarApp").addEventListener("click",()=>{

deferredPrompt.prompt()

})

</script>

</body>
</html>
