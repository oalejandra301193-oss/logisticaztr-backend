<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Registro Chofer</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#020617;
color:white;
}

.container{
background:#0f172a;
padding:40px;
border-radius:16px;
width:95%;
max-width:500px;
box-shadow:0 0 40px rgba(0,0,0,0.8);
}

h2{
margin-bottom:25px;
text-align:center;
font-size:26px;
}

input{
width:100%;
padding:16px;
margin:12px 0;
border:none;
border-radius:8px;
font-size:16px;
background:#1e293b;
color:white;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:16px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#16a34a;
}

</style>

</head>

<body>

<h2>Registro de Chofer</h2>

<input id="nombre" placeholder="Nombre">

<input id="apellido" placeholder="Apellido">

<input id="dni" placeholder="DNI">

<input id="telefono" placeholder="Teléfono">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Contraseña">

<button onclick="registrar()">Crear cuenta</button>

<script>

async function registrar(){

const data = {

nombre:document.getElementById("nombre").value,
apellido:document.getElementById("apellido").value,
dni:document.getElementById("dni").value,
telefono:document.getElementById("telefono").value,
email:document.getElementById("email").value,
password:document.getElementById("password").value

};

const res = await fetch("https://logisticaztr-backend.onrender.com/api/auth/chofer/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

if(!res.ok){
alert("Error al registrar");
return;
}

alert("Chofer registrado correctamente");

window.location="login-chofer.html";

}

</script>

</body>

</html>
