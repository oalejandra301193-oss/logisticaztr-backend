<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portal Cliente - Logistica ZTR</title>
<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

h2, h3{
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

button{
  padding:8px 12px;
  margin-top:8px;
  margin-right:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.ver{ background:#2563eb; color:white; }
.eliminar{ background:#dc2626; color:white; }

.estado{
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  margin-left:10px;
}

.publicado{background:#334155}
.en_viaje{background:#16a34a}
.finalizado{background:#64748b}

input, select{ width:100%; padding:8px; margin-top:5px; margin-bottom:10px; border-radius:6px; border:none; }
</style>
</head>

<body>

<h3>Publicar carga</h3>
<div id="vistaPublicar" class="card">
<input id="producto" placeholder="Producto">
<input id="origen" placeholder="Ciudad de origen">
<input id="destino" placeholder="Ciudad de destino">
<input id="distancia" placeholder="Distancia KM" readonly>
<input id="valor" placeholder="Valor del viaje">
<select id="tipoCarga">
  <option value="granel">Granel</option>
  <option value="bolsas">Mercadería embolsada</option>
  <option value="pallet">Palletizada</option>
  <option value="general">Carga general</option>
  <option value="pie">Tabla por pie</option>
</select>
<input id="cantidad" placeholder="Cantidad (toneladas / bultos / pallets / pies)">

<!-- 🔒 CAMPOS INTERNOS OCULTOS PARA GUARDAR COORDENADAS GEOGRÁFICAS -->
<input type="hidden" id="origenLat">
<input type="hidden" id="origenLng">
<input type="hidden" id="destinoLat">
<input type="hidden" id="destinoLng">

<button onclick="calcularDistancia()">Calcular distancia por carretera</button>
<button onclick="calcularFlete()">Calcular flete</button>
<button onclick="crearCarga()">Publicar carga</button>
<button onclick="window.location='app-cliente.html'">
⬅ Volver al perfil
</button>

<button onclick="window.location.href='mis-cargas.html'">
📦 Mis cargas
</button>

<script>
// ======================
// CREAR CARGA (REPARADO Y CONVERTIDO A NÚMERO)
// ======================
async function crearCarga(){
  const clienteId = localStorage.getItem("clienteId");

  if(!clienteId){
    alert("Tenés que iniciar sesión");
    return;
  }

  // TRAER DATOS DEL CLIENTE
  const resCliente = await fetch("/clientes/" + clienteId);
  const cliente = await resCliente.json();

  const producto = document.getElementById("producto").value;
  const origen = document.getElementById("origen").value;
  const destino = document.getElementById("destino").value;
  const distancia = document.getElementById("distancia").value;
  const valor = document.getElementById("valor").value;
  const tipo = document.getElementById("tipoCarga").value;
  const cantidad = document.getElementById("cantidad").value;

  const origenLat = document.getElementById("origenLat").value;
  const origenLng = document.getElementById("origenLng").value;
  const destinoLat = document.getElementById("destinoLat").value;
  const destinoLng = document.getElementById("destinoLng").value;

  if(!producto||!origen||!destino||!distancia||!valor||!tipo||!cantidad||!origenLat||!destinoLat){
    alert("⚠ Completa todos los datos y calcula la distancia antes de publicar");
    return;
  }

  const data = {
    producto,
    origen,
    destino,
    distanciaKm: Number(distancia), // 🔥 FORZADO A NÚMERO
    valor: Number(valor),           // 🔥 FORZADO A NÚMERO
    tipoCarga: tipo,
    cantidad: Number(cantidad),     // 🔥 FORZADO A NÚMERO
    clienteId: String(clienteId),

    // 🔥 CORREGIDO: Las coordenadas se envían convertidas a Number para cumplir con el esquema de Mongoose
    origenLat: Number(origenLat),
    origenLng: Number(origenLng),
    destinoLat: Number(destinoLat),
    destinoLng: Number(destinoLng),

    clienteNombre: cliente.nombre,
    clienteCUIT: cliente.cuit,
    clienteTelefono: cliente.telefono,
    clienteComercio: cliente.comercio,
    direccionCarga: cliente.direccionCarga,
    direccionDescarga: cliente.direccionDescarga,
    estado:"PENDIENTE"
  };

  const res = await fetch("/trips",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });

  if(!res.ok){
    const error = await res.text();
    console.log("ERROR BACK:", error);
    alert("❌ Error al crear carga. Verifique la consola.");
    return;
  }

  alert("✅ Carga enviada para aprobación");
  window.location.href = "mis-cargas.html";
}


// ======================
// ELIMINAR
// ======================
async function eliminarCarga(id){
  if(!confirm("Eliminar carga?")) return;
  await fetch("/trips/"+id,{method:"DELETE"});
}

// ======================
// CALCULAR DISTANCIA REAL POR CARRETERA (REPARADO Y SINCRO)
// ======================
async function calcularDistancia(){
  const origen = document.getElementById("origen").value;
  const destino = document.getElementById("destino").value;
  if(!origen || !destino){ alert("Ingrese origen y destino"); return; }

  try {
    // 1. Buscamos las coordenadas exactas de las ciudades en Nominatim
    // 🔥 CORREGIDO: Reincorporadas las URLs nativas de OpenStreetMap completas
    const res1 = await fetch(`https://openstreetmap.org{encodeURIComponent(origen)}`);
    const data1 = await res1.json();
    const res2 = await fetch(`https://openstreetmap.org{encodeURIComponent(destino)}`);
    const data2 = await res2.json();
    
    // Validación estricta con corchetes porque Nominatim devuelve un Arreglo de resultados
    if(!data1 || data1.length === 0 || !data2 || data2.length === 0){ 
      alert("No se pudieron encontrar las coordenadas de las ciudades ingresadas"); 
      return; 
    }

    const lat1 = parseFloat(data1[0].lat), lon1 = parseFloat(data1[0].lon);
    const lat2 = parseFloat(data2[0].lat), lon2 = parseFloat(data2[0].lon);

    // Guardamos las coordenadas obtenidas en los inputs ocultos para enviárselas al backend
    document.getElementById("origenLat").value = lat1;
    document.getElementById("origenLng").value = lon1;
    document.getElementById("destinoLat").value = lat2;
    document.getElementById("destinoLng").value = lon2;

    // 2. Consultamos al servidor de mapas terrestre estable para saber la distancia exacta por asfalto
    // 🔥 CORREGIDO: Reincorporada la URL vial OSRM completa de openstreetmap.de para evitar fallos de red
    const urlOSRM = `https://openstreetmap.de{lon1},${lat1};${lon2},${lat2}?overview=false`;
    const resRoute = await fetch(urlOSRM);
    const dataRoute = await resRoute.json();

    if (dataRoute.code === "Ok" && dataRoute.routes && dataRoute.routes.length > 0) {
      const kmReales = dataRoute.routes[0].distance / 1000;
      document.getElementById("distancia").value = kmReales.toFixed(1);
    } else {
      alert("No se pudo calcular la ruta terrestre por carretera específica entre estos puntos");
    }
  } catch(e) {
    console.error(e);
    alert("Error de conexión con el servidor de mapas geográficos");
  }
}

function calcularFlete(){
  const km = parseFloat(document.getElementById("distancia").value);
  const tipo = document.getElementById("tipoCarga").value;
  const cantidad = parseFloat(document.getElementById("cantidad").value);
  if(!km){ alert("Primero calcule la distancia"); return; }

  let tarifa = 0;
  
  // 🔥 ACTUALIZADO: Tarifas reales en pesos argentinos y limpieza de duplicados
  if(tipo === "granel")   tarifa = 90000;  // $90.000 por Tonelada
  if(tipo === "bolsas")   tarifa = 1500;   // $1.500 por Bolsa
  if(tipo === "pallet")   tarifa = 75000;  // $75.000 por Pallet
  if(tipo === "general")  tarifa = 150000; // Carga General (Mantiene base de referencia alta)
  if(tipo === "pie")      tarifa = 130;    // $130 por Pie de tabla

  // 📐 NUEVA LÓGICA DIRECTA: Multiplica la cantidad exacta por el valor de su tarifa correspondiente
  const fleteTotal = cantidad * tarifa;

  // Escribimos el valor redondeado y prolijo en el campo correspondiente
  document.getElementById("valor").value = Math.round(fleteTotal);
  console.log(`💰 Flete calculado: $${Math.round(fleteTotal).toLocaleString('es-AR')} ARS.`);
}

// ======================
// PAGAR ADELANTO (REPARADO Y CONECTADO CON REDIRECCIÓN A PAYPAL)
// ======================
async function pagarAdelanto(id, tipoPago){
  if(!id) { alert("ID de viaje inválido"); return; }
  const tipo = tipoPago || "adelanto";

  try {
    const res = await fetch("/api/payments/crear-pago",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        tripId: id,
        tipo: tipo 
      })
    });

    const data = await res.json();

    if(!data.id){
      alert("Error generando orden de pago de PayPal");
      return;
    }

    // 🔥 SOLUCIÓN: Redirigimos de forma nativa al flujo de checkout usando el ID recibido de Sandbox
    window.location.href = `https://paypal.com{data.id}`;

  } catch(err) {
    console.error("Error en pasarela de pagos:", err);
    alert("Error de red intentando conectar con PayPal");
  }
}

// ======================
// Ver viaje en curso
// ======================
async function verViaje(){
  const res = await fetch("/mis-viajes");
  const viajes = await res.json();
  if(!viajes.length){ alert("Todavía no tenés una carga en viaje"); return; }
  alert(`Carga en viaje:\nProducto: ${viajes[0].producto}\nEstado: ${viajes[0].estado}`);
}

async function puntuar(id, rating){
  await fetch("/trips/rating-chofer",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      tripId:id,
      rating
    })
  });

  alert("Gracias por calificar");
}

</script>
</body>
</html>
