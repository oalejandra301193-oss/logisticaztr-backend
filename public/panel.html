<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Panel LogisticaZTR</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:20px;
font-size:24px;
}

.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:30px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.card:hover{
background:#334155;
transform:scale(1.05);
}

.numero{
font-size:40px;
margin-top:10px;
}

</style>

</head>

<body>

<header>
🚚 Panel de Operaciones LogisticaZTR
</header>

<div class="container">

<div class="card" onclick="window.location='admin-mapa.html'">
📍 Ver camiones en mapa
</div>

<div class="card">
🚚 Viajes activos
<div class="numero" id="activos">0</div>
</div>

<div class="card">
📦 Cargas publicadas
<div class="numero" id="cargas">0</div>
</div>

<div class="card" onclick="window.location='ranking.html'">
🏆 Ranking choferes
</div>

<div class="card" onclick="window.location='flota.html'">
🚛 Flota
</div>

<div class="card" onclick="window.location='empresa.html'">
🏢 Empresa
</div>

</div>

<script>

async function cargar(){

const res = await fetch("/trips/mapa");

const viajes = await res.json();

let activos=0;

viajes.forEach(v=>{

if(v.estado==="EN_VIAJE"){

activos++;

}

});

document.getElementById("activos").innerText=activos;
document.getElementById("cargas").innerText=viajes.length;

}

cargar()

</script>

</body>

</html>
