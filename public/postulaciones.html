<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Postulaciones</title>
</head>

<body>

<h2>Postulaciones de choferes</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("/trips/postulaciones")

const data = await res.json()

let html=""

data.forEach(p=>{

html+=`
<div style="border:1px solid #ccc;margin:10px;padding:10px">

Chofer: ${p.nombre}<br>
Camión: ${p.camion}<br>
Carga: ${p.origen} → ${p.destino}

</div>
`

})

document.getElementById("lista").innerHTML=html

}

cargar()

</script>

</body>
</html>
