<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cargas finalizados</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}
</style>

</head>

<body>

<h2>✅ Viajes finalizados</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("/trips")
const viajes = await res.json()

let html=""

viajes.forEach(v=>{

if(v.estado === "FINALIZADO"){

html += `
<div class="card">

<b>${v.producto}</b><br>
${v.origen} → ${v.destino}<br>

👤 Cliente: ${v.clienteNombre}<br>
🚛 Chofer: ${v.chofer?.nombre || "-"}

<br><br>

⭐ Chofer: ${v.ratingChofer || 0}
<br>
⭐ Cliente: ${v.ratingCliente || 0}

</div>
`
}

})

document.getElementById("lista").innerHTML = html

}

cargar()

</script>

</body>
</html>
