<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Portal Chofer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

#map{
  height:300px;
  border-radius:10px;
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

button{
  padding:8px;
  margin-top:10px;
}
</style>

</head>

<body>

<h2>🚛 Portal Chofer</h2>

<div id="map"></div>

<h3>📦 Cargas cercanas</h3>
<div id="lista">Cargando...</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let miMarker;
let markers = [];

// 🔹 INICIALIZAR MAPA
function iniciarMapa(lat,lng){

map = L.map('map').setView([lat,lng],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

miMarker = L.marker([lat,lng]).addTo(map)
.bindPopup("🚛 Tu ubicación")
.openPopup();

}

// 🔹 ACTUALIZAR UBICACIÓN EN MAPA
function actualizarMiUbicacion(lat,lng){
if(miMarker){
miMarker.setLatLng([lat,lng]);
}
}

// 🔹 OBTENER UBICACIÓN
navigator.geolocation.getCurrentPosition(async (pos)=>{

try{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

iniciarMapa(lat,lng);

const choferId = localStorage.getItem("choferId");

// 🔴 VALIDACIÓN
if(!choferId){
alert("Falta choferId en localStorage");
return;
}

// 🔹 GUARDAR UBICACIÓN
await fetch("/trips/location",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
lat,
lng,
driverId:choferId
})
});

// 🔹 CARGAR CARGAS
cargarCargas(choferId);

}catch(error){

console.error("❌ Error ubicación:", error);

}

});

// 🔹 CARGAR CARGAS CERCANAS
async function cargarCargas(choferId){

try{

const res = await fetch("/trips/cargas-cercanas/"+choferId);

// 🔴 VALIDACIÓN
if(!res.ok){
throw new Error("Error HTTP " + res.status);
}

const viajes = await res.json();

let html = "";

// 🔹 LIMPIAR MARCADORES
markers.forEach(m=>map.removeLayer(m));
markers = [];

viajes.forEach(v=>{

if(!v.origenLat || !v.origenLng) return;

// 🔹 MARCADOR
const marker = L.marker([v.origenLat, v.origenLng])
.addTo(map)
.bindPopup("📦 Carga disponible");

markers.push(marker);

// 🔹 LISTADO
html += `
<div class="card">

📦 <b>${v.producto || "-"}</b><br>
📍 Zona aproximada<br>
💰 $${v.valor || 0}<br>
📏 ${v.distancia ? v.distancia.toFixed(1) : 0} km<br>

<button onclick="postular('${v._id}')">
Postularme
</button>

</div>
`;

});

// 🔴 SIN RESULTADOS
if(html === ""){
html = "<p>No hay cargas cercanas</p>";
}

document.getElementById("lista").innerHTML = html;

}catch(error){

console.error("❌ Error cargando cargas:", error);

document.getElementById("lista").innerHTML =
"<p>Error cargando cargas</p>";

}

}

// 🔹 POSTULARSE
async function postular(id){

try{

const res = await fetch("/trips/postular/"+id,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
nombre: localStorage.getItem("nombre"),
telefono: localStorage.getItem("telefono"),
dni: localStorage.getItem("dni"),
patente1: localStorage.getItem("patente1")
})
});

if(res.ok){
alert("✅ Postulación enviada");
}else{
alert("❌ Error al postularte");
}

}catch(error){

console.error("❌ Error postulación:", error);
alert("Error de conexión");

}

}

// 🔄 ACTUALIZAR CARGAS CADA 15s
setInterval(()=>{

const choferId = localStorage.getItem("choferId");
if(choferId){
cargarCargas(choferId);
}

},15000);

</script>

</body>
</html>
