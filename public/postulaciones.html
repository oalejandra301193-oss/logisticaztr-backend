<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Postulaciones</title>
</head>

<body>

<h2>Postulaciones de Choferes</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("/trips");
const viajes = await res.json();

let html="";

viajes.forEach(v=>{

v.postulaciones.forEach(p=>{

html+=`

<div>

Chofer: ${p.nombre}<br>
DNI: ${p.dni}

<br>

<button onclick="aceptar('${v._id}','${p.dni}')">
Aceptar
</button>

<button onclick="rechazar('${v._id}','${p.dni}')">
Rechazar
</button>

<hr>

</div>

`

})

})

document.getElementById("lista").innerHTML=html

}

async function aceptar(tripId,dni){

await fetch("/trips/aceptar-chofer",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({tripId,dni})
})

alert("Chofer asignado")

}

async function rechazar(tripId,dni){

await fetch("/trips/rechazar-chofer",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({tripId,dni})
})

alert("Postulación eliminada")

}

cargar()

</script>


</body>
</html>
