<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finanzas - LogisticaZTR</title>
<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:30px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin:10px;
  border-radius:10px;
}

.numero{
  font-size:35px;
}
</style>
</head>
<body>

<h1>💰 Finanzas LogisticaZTR</h1>

<div class="card">
Total facturado
<div class="numero" id="totalFacturado">0</div>
</div>

<div class="card">
Comisiones de la plataforma
<div class="numero" id="comisiones">0</div>
</div>

<div class="card">
Viajes finalizados
<div class="numero" id="viajesFinalizados">0</div>
</div>

<h2>Detalle de viajes</h2>
<div id="listaViajes"></div>

<h2>Comisiones pagadas</h2>
<div id="listaComisiones"></div>

<script>
const API = "https://logisticaztr-backend.onrender.com";
const token = localStorage.getItem("token");

// 🔒 VALIDACIÓN ADMIN
if(!token){
  alert("No autorizado");
  window.location = "/login-admin.html";
}

async function cargarFinanzas(){
  try{
    const res = await fetch(`${API}/trips`, {
      headers:{
        "Authorization": "Bearer " + token
      }
    });

    if(!res.ok) throw new Error("Error cargando viajes");

    const viajes = await res.json();

    let total = 0;
    let comisiones = 0;
    let finalizados = 0;

    let htmlViajes = "";
    let htmlComisiones = "";

    viajes.forEach(v=>{
      if(v.valor){
        total += Number(v.valor);
        const comision = v.valor * 0.05;
        comisiones += comision;

        if(v.comisionPagada){
          htmlComisiones += `
          <div class="card">
            Viaje: ${v.producto}<br>
            Cliente: ${v.clienteNombre || "-"}<br>
            Chofer: ${v.choferNombre || "-"}<br>
            Comisión pagada: $${comision.toFixed(2)}
          </div>
          `;
        }
      }

      if(v.estado==="ENTREGADO") finalizados++;

      htmlViajes += `
      <div class="card">
        ${v.origen} → ${v.destino}<br>
        Cliente: ${v.clienteNombre || "-"}<br>
        Valor: $${v.valor || 0}<br>
        Estado: ${v.estado || "-"}
      </div>
      `;
    });

    document.getElementById("totalFacturado").innerText = "$" + total.toFixed(2);
    document.getElementById("comisiones").innerText = "$" + comisiones.toFixed(2);
    document.getElementById("viajesFinalizados").innerText = finalizados;

    document.getElementById("listaViajes").innerHTML = htmlViajes;
    document.getElementById("listaComisiones").innerHTML = htmlComisiones;

  }catch(err){
    console.error(err);
    document.getElementById("listaViajes").innerHTML = "<p>❌ Error cargando finanzas</p>";
    document.getElementById("listaComisiones").innerHTML = "";
  }
}

cargarFinanzas();
</script>

</body>
</html>
