<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Clientes - LogisticaZTR</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

button{
  padding:6px 10px;
  margin-top:8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}
</style>
</head>

<body>

<h2>👤 Clientes</h2>

<div id="lista"></div>

<script>
const API = "https://logisticaztr-backend.onrender.com";
const token = localStorage.getItem("token");

// 🔒 VALIDACIÓN ADMIN
if(!token){
  alert("No autorizado");
  window.location = "/login-admin.html";
}

// =======================
// CARGAR CLIENTES
// =======================
async function cargar(){
  try{
    const res = await fetch(`${API}/clientes`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if(!res.ok) throw new Error("Error al cargar clientes");

    const clientes = await res.json();
    let html = "";

    clientes.forEach(c=>{
  html += `
  <div class="card">

    ${c.logo 
      ? `<img src="${API}/uploads/clientes/${c.logo}" width="80"><br><br>`
      : ""
    }

    <b>Nombre:</b> ${c.nombre || "-"}<br>
    <b>Comercio:</b> ${c.comercio || "-"}<br>
    <b>CUIT:</b> ${c.cuit || "-"}<br>
    <b>Teléfono:</b> ${c.telefono || "-"}<br>

    <b>Dirección de carga:</b> ${c.direccionCarga || "-"}<br>
    <b>Dirección de descarga:</b> ${c.direccionDescarga || "-"}<br>

    <b>Viajes:</b> ${c.viajes || 0}<br><br>

    <input type="file" id="file-${c._id}">
    <button onclick="subirArchivo('${c._id}')">Subir archivo</button><br><br>

    <div>
    ${
      c.archivos && c.archivos.length > 0
      ? c.archivos.map(a =>
        `<a href="${API}/uploads/clientes/${a}" target="_blank">📄 Ver archivo</a><br>`
      ).join("")
      : "Sin archivos"
    }
    </div>

  </div>
  `;
});

    document.getElementById("lista").innerHTML = html;

  }catch(err){
    console.error(err);
    document.getElementById("lista").innerHTML = "❌ Error cargando clientes";
  }
}

cargar();

// =======================
// SUBIR ARCHIVO (ADMIN)
// =======================
async function subirArchivo(id){
  const input = document.getElementById("file-"+id);
  if(!input.files[0]){
    alert("Seleccioná un archivo");
    return;
  }

  const formData = new FormData();
  formData.append("archivo", input.files[0]);

  try{
    const res = await fetch(`${API}/clientes/${id}/archivo`,{
      method:"POST",
      headers:{
        "Authorization": "Bearer " + token
      },
      body:formData
    });

    if(res.ok){
      alert("Archivo subido correctamente");
      cargar();
    }else{
      alert("❌ Error al subir archivo");
    }
  }catch(err){
    console.error(err);
    alert("❌ Error al subir archivo");
  }
}
</script>

</body>
</html>
