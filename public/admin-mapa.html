<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Mapa de Camiones - Logística ZTR</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
}

#map{
height:600px;
width:100%;
}

</style>

</head>

<body>

<h2>🛰 Mapa de Camiones en Vivo</h2>

<div id="map"></div>

<script>

const map = L.map("map").setView([-34.6,-58.38],5);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19
}
).addTo(map);

let markers = {};

async function cargarCamiones(){

const res = await fetch("/trips/mapa");

const data = await res.json();

data.forEach(trip=>{

if(!trip.lat || !trip.lng) return;

if(!markers[trip.id]){

markers[trip.id] = L.marker([trip.lat,trip.lng])
.addTo(map)
.bindPopup(
`🚛 ${trip.producto}<br>
📍 ${trip.origen} → ${trip.destino}`
);

}else{

markers[trip.id].setLatLng([trip.lat,trip.lng]);

}

});

}

// actualizar cada 5 segundos
setInterval(cargarCamiones,5000);

cargarCamiones();

</script>

</body>
</html>
