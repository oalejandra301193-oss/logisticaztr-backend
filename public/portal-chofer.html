<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Portal Chofer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

#map{
  height:300px;
  border-radius:10px;
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

button{
  padding:8px;
  margin-top:10px;
}
</style>

</head>

<body>

<h2>🚛 Portal Chofer</h2>

<div id="map"></div>

<h3>📦 Cargas cercanas</h3>
<div id="lista"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let miMarker;

// 🔥 INICIALIZAR MAPA
function iniciarMapa(lat,lng){

map = L.map('map').setView([lat,lng],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

miMarker = L.marker([lat,lng]).addTo(map)
.bindPopup("🚛 Tu ubicación")
.openPopup();

}

// 🔥 OBTENER UBICACIÓN DEL CHOFER
navigator.geolocation.getCurrentPosition(async (pos)=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

iniciarMapa(lat,lng);

// 🔥 GUARDAR UBICACIÓN EN BACKEND
const choferId = localStorage.getItem("choferId");

await fetch("/trips/location",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
lat,
lng,
driverId:choferId
})
});

// 🔥 CARGAR CARGAS ORDENADAS
cargarCargas(choferId);

});


// 🔥 CARGAR CARGAS CERCANAS
async function cargarCargas(choferId){

const res = await fetch("/trips/cargas-cercanas/"+choferId);
const viajes = await res.json();

let html = "";

// limpiar marcadores anteriores (opcional simple)
if(window.markers){
window.markers.forEach(m=>map.removeLayer(m));
}
window.markers = [];

viajes.forEach(v=>{

// 🔥 MARCAR EN MAPA (SIN DIRECCIÓN EXACTA)
const marker = L.marker([v.origenLat, v.origenLng])
.addTo(map)
.bindPopup("📦 Carga disponible");

window.markers.push(marker);

// 🔥 LISTADO
html += `
<div class="card">

📦 ${v.producto || "-" } <br>
📍 Zona aproximada <br>
💰 $${v.valor} <br>
📏 ${v.distancia.toFixed(1)} km <br>

<button onclick="postular('${v._id}')">
Postularme
</button>

</div>
`;

});

document.getElementById("lista").innerHTML = html;

}


// 🔥 POSTULARSE (CORREGIDO)
async function postular(id){

const res = await fetch("/trips/postular/"+id,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
nombre: localStorage.getItem("nombre"),
telefono: localStorage.getItem("telefono"),
dni: localStorage.getItem("dni"),
patente1: localStorage.getItem("patente1")
})
});

if(res.ok){
alert("Postulación enviada");
}else{
alert("Error al postularte");
}

}

</script>

</body>
</html>
