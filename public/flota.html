<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Flota - Logistica ZTR</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
margin:10px;
border-radius:10px;
}

#mapa{
height:500px;
margin-top:20px;
border-radius:10px;
}
</style>

</head>

<body>

<h2>🚛 Flota de Choferes</h2>

<div id="lista"></div>
<div id="mapa"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let mapa = L.map("mapa").setView([-34.6,-58.4],5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19
}).addTo(mapa);

let marcadores = [];

async function cargar(){

try{

const res = await fetch("/drivers");
const drivers = await res.json();

let html = "";

// limpiar mapa
marcadores.forEach(m=>mapa.removeLayer(m));
marcadores = [];

drivers.forEach(d=>{

html += `
<div class="card">
👨‍✈️ ${d.nombre || "Sin nombre"}<br>
🪪 DNI: ${d.dni || "-"}<br>
🟢 Disponible: ${d.disponible ? "SI" : "NO"}
</div>
`;

if(d.ultimaUbicacion){

const marker = L.marker([
d.ultimaUbicacion.lat,
d.ultimaUbicacion.lng
]).addTo(mapa);

marker.bindPopup("🚛 " + (d.nombre || "Chofer"));

marcadores.push(marker);

}

});

document.getElementById("lista").innerHTML = html;

}catch(err){
console.error(err);
}

}

setInterval(cargar,5000);
cargar();

</script>

</body>
</html>
