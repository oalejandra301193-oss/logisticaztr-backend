<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Cargas - Logistica ZTR</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

h2{
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

button{
  padding:8px 12px;
  margin-top:8px;
  margin-right:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.mapa{ background:#2563eb; color:white; }
.pagar{ background:#16a34a; color:white; }
.eliminar{ background:#dc2626; color:white; }

.estado{
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  margin-left:10px;
}

.publicado{background:#334155}
.en_viaje{background:#16a34a}
.finalizado{background:#64748b}

.chofer{
  display:flex;
  align-items:center;
  margin-top:10px;
}

.chofer img{
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
}
</style>
</head>

<body>

<h2>📦 Mis cargas</h2>

<button onclick="window.location.href='cliente-portal.html'">
⬅ Volver a publicar
</button>

<div id="contenedor">Cargando tus fletes...</div>

<script>

// ======================
// CARGAR MIS CARGAS
// ======================
async function cargarMisCargas(){
  const clienteId = localStorage.getItem("clienteId");

  if(!clienteId){
    alert("Tenés que iniciar sesión");
    window.location.href = "login-cliente.html";
    return;
  }

  try{
    const res = await fetch(`/trips/cliente/${clienteId}`);
    const viajes = await res.json();

    if(!viajes.length){
      document.getElementById("contenedor").innerHTML = "No tenés cargas todavía";
      return;
    }

    let html = "";

    viajes.forEach(v=>{
      let estadoClass="publicado";
      if(v.estado==="EN_VIAJE") estadoClass="en_viaje";
      if(v.estado==="FINALIZADO") estadoClass="finalizado";

      // 🔥 CORREGIDO: Usamos la variable directa choferNombre del modelo Trip.js para evitar el error de asignación
      const nombreChoferAsignado = v.choferNombre || v.chofer?.nombre || "Sin chofer asignado";

      html+=`
      <div class="card">
        <b>📦 ${v.producto}</b><br>
        📍 ${v.origen} → ${v.destino}<br>
        💰 $${v.valor}<br>
        📏 Distancia: ${v.distanciaKm || 0} km<br>

        Estado: <span class="estado ${estadoClass}">${v.estado}</span>

        <div class="chofer">
          ${
            v.choferFoto 
            ? `<img src="/uploads/choferes/${v.choferFoto}">`
            : `<img src="https://via.placeholder.com/40">`
          }
          <div>
            👨‍✈️ <b>Chofer:</b> ${nombreChoferAsignado}
          </div>
        </div>

        <br>

        ${
          v.estado === "PENDIENTE"
          ? `<button class="eliminar" onclick="eliminarCarga('${v._id}')">🗑 Eliminar</button>`
          : ""
        }

        ${!v.adelantoPagado
          ? `<button class="pagar" onclick="pagarAdelanto('${v._id}')">💰 Pagar flete (PayPal)</button>`
          : `<span>✅ Adelanto de flete pagado exitosamente</span>`
        }

        ${
          v.estado === "EN_VIAJE"
          ? `<button class="mapa" onclick="verMapa('${v._id}')">🛰️ Rastrear GPS en vivo</button>`
          : ""
        }

        ${
          v.estado === "FINALIZADO"
          ? `
          <br><br>
          <b>Calificar el servicio del transportista:</b><br>
          <button onclick="puntuar('${v._id}',5)">⭐⭐⭐⭐⭐</button>
          <button onclick="puntuar('${v._id}',4)">⭐⭐⭐⭐</button>
          <button onclick="puntuar('${v._id}',3)">⭐⭐⭐</button>
          `
          : ""
        }
      </div>
      `;
    });

    document.getElementById("contenedor").innerHTML = html;

  }catch(err){
    console.error("❌ Error en visor de cargas:", err);
    document.getElementById("contenedor").innerHTML = "❌ Error cargando cargas de MongoDB Atlas";
  }
}

// ======================
// ELIMINAR
// ======================
async function eliminarCarga(id){
  if(!confirm("¿Desea eliminar de forma permanente esta carga flete?")) return;
  await fetch("/trips/"+id,{method:"DELETE"});
  cargarMisCargas();
}

// ======================
// PAGAR ADELANTO (REPARADO Y CONECTADO A LA API DE PAYPAL MODERNA)
// ======================
async function pagarAdelanto(id){
  console.log("⚡ Iniciando solicitud de pago PayPal para viaje:", id);

  try{
    // 🔥 CORREGIDO: Apunta a la ruta oficial unificada pasando el tipo correcto de transacción
    const res = await fetch("/api/payments/crear-pago",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        tripId: id,
        tipo: "adelanto" 
      })
    });

    const data = await res.json();
    console.log("Respuesta PayPal:", data);

    // 🔥 CORREGIDO: Valida la inyección del id del checkout en vez del url obsoleto
    if(!data.id){
      alert("Error generando orden interna en los servidores de PayPal");
      return;
    }

    // 🔥 SOLUCIÓN: Redirección directa hacia la interfaz oficial de pagos en modo de prueba (Sandbox)
    window.location.href = `https://paypal.com${data.id}`;

  }catch(err){
    console.error(err);
    alert("Error de red intentando conectar con la pasarela de pagos");
  }
}

// ======================
// MAPA (UNIFICADO AL RASTREADOR REAL LEAFLET)
// ======================
function verMapa(id){
  // 🔥 CORREGIDO: Redirige hacia tu archivo de mapas interactivos unificado pasando el id por parámetro de URL
  window.location.href = `seguimiento.html?id=${id}`;
}

// ======================
// PUNTUAR
// ======================
async function puntuar(id, rating){
  try {
    await fetch("/trips/rating-chofer",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        tripId:id,
        rating
      })
    });

    alert("¡Muchas gracias por calificar al transportista!");
    cargarMisCargas();
  } catch(e) {
    console.error(e);
  }
}

// Inicialización de arranque de sesión
cargarMisCargas();

</script>
</body>
</html>
