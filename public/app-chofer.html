<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App Chofer ZTR</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">

<!-- Leaflet oficial estable -->
<link rel="stylesheet" href="https://unpkg.com"/>
<script src="https://unpkg.com"></script>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

input{
  display:block;
  margin:5px 0;
  padding:8px;
  width: 100%;
  border-radius: 6px;
  border: none;
}

button{
  padding:10px 14px;
  margin-top:10px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #1d4ed8; }

.btn-postular { background: #16a34a; }
.btn-postular:hover { background: #15803d; }

#mapa {
  height:300px;
  border-radius:10px;
  margin-top: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<h2>🚛 App Chofer</h2>

<h3>Mi perfil</h3>

<div id="formPerfil" class="card">
  <input id="nombre" placeholder="Nombre">
  <input id="apellido" placeholder="Apellido">
  <input id="dni" placeholder="DNI">
  <input id="telefono" placeholder="Teléfono">
  <input id="patente1" placeholder="Patente 1 (Chasis)">
  <input id="patente2" placeholder="Patente 2 (Acoplado)">
  <input id="patente3" placeholder="Patente 3 (Opcional)">
  <button onclick="guardarPerfil()">Guardar perfil</button>
</div>

<h3>Foto de Perfil / Carnet</h3>
<div class="card">
  <input type="file" id="foto">
  <button onclick="subirFoto()">Subir foto</button>
</div>

<div id="miPerfil"></div>

<h3>📦 Radar de Cargas Disponibles (Ruta Real)</h3>
<div id="lista">Cargando ofertas cercanas terrestres...</div>

<div id="mapa"></div>

<script>

let mapa;
let markers = [];

// 🔹 INICIALIZAR MAPA CONTROLADO
function iniciarMapa(lat, lng){
  if(mapa) return; // Evita duplicar el mapa si se ejecuta dos veces

  mapa = L.map("mapa").setView([lat, lng], 10);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19
  }).addTo(mapa);

  L.marker([lat, lng]).addTo(mapa).bindPopup("🚛 Tu ubicación actual");
}

// 🔹 CARGAR PERFIL DEL CHOFER
async function mostrarPerfil(){
  const id = localStorage.getItem("choferId");
  if(!id) return;

  try {
    // 🔥 CORREGIDO: Cambiado de /choferes/ a /drivers/ que es tu ruta real de server.js
    const res = await fetch("/drivers/" + id);
    const d = await res.json();

    // Guardamos en local para usar al postularse
    localStorage.setItem("nombre", d.nombre || "");
    localStorage.setItem("telefono", d.telefono || "");
    localStorage.setItem("dni", d.dni || "");
    localStorage.setItem("patente1", d.patente1 || "");

    // Autorellenamos los inputs por comodidad
    document.getElementById("nombre").value = d.nombre || "";
    document.getElementById("apellido").value = d.apellido || "";
    document.getElementById("dni").value = d.dni || "";
    document.getElementById("telefono").value = d.telefono || "";
    document.getElementById("patente1").value = d.patente1 || "";
    document.getElementById("patente2").value = d.patente2 || "";
    document.getElementById("patente3").value = d.patente3 || "";

    document.getElementById("miPerfil").innerHTML=`
      <div class="card" style="border-left: 5px solid #3b82f6;">
        👨‍✈️ <b>${d.nombre || ""} ${d.apellido || ""}</b><br>
        📞 Teléfono: ${d.telefono || "-"}<br>
        🪪 DNI: ${d.dni || "-"}<br>
        🚛 Patente: ${d.patente1 || "-"}
      </div>
    `;
  } catch(e) {
    console.error("Error cargando perfil del chofer", e);
  }
}

// 🔹 GUARDAR PERFIL (ACTUALIZAR)
async function guardarPerfil(){
  const id = localStorage.getItem("choferId");
  if(!id) { alert("Inicie sesión como chofer primero"); return; }

  const data={
    nombre: document.getElementById("nombre").value,
    apellido: document.getElementById("apellido").value,
    dni: document.getElementById("dni").value,
    telefono: document.getElementById("telefono").value,
    patente1: document.getElementById("patente1").value,
    patente2: document.getElementById("patente2").value,
    patente3: document.getElementById("patente3").value
  };

  try {
    // 🔥 CORREGIDO: Ruta alineada con tu backend Express /drivers/
    const res = await fetch(`/drivers/${id}/perfil`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    if(res.ok){
      alert("✅ Perfil de chofer actualizado con éxito");
      mostrarPerfil();
    } else {
      alert("❌ Error guardando datos en el servidor");
    }
  } catch(e) {
    console.error(e);
  }
}

// 🔹 CARGAR CARGAS CON EL NUEVO RADAR ASÍNCRONO DEL BACKEND
async function cargarCargas(){
  const choferId = localStorage.getItem("choferId");
  if(!choferId) return;

  try {
    // 🔥 REEMPLAZADO: En vez de hacer Haversine en el navegador, consultamos el radar vial real 
    // que inyectamos en tu routes/trips.js utilizando OSRM por carretera
    const res = await fetch("/trips/cargas-cercanas/" + choferId);
    const lista = await res.json();

    // Limpiar marcadores viejos
    if (mapa) {
      markers.forEach(m => mapa.removeLayer(m));
    }
    markers = [];

    let html = "";

    if(!lista.length) {
      document.getElementById("lista").innerHTML = "<p>No hay cargas disponibles cerca de tu posición por carretera.</p>";
      return;
    }

    lista.forEach(v => {
      // 📦 Dibujar marcador de carga disponible en el mapa Leaflet
      if (mapa && v.origenLat && v.origenLng) {
        const marker = L.marker([parseFloat(v.origenLat), parseFloat(v.origenLng)])
          .addTo(mapa)
          .bindPopup(`<b>Carga: ${v.producto}</b><br>Destino: ${v.destino}`);
        markers.push(marker);
      }

      // Estructurar tarjeta de oferta
      html += `
        <div class="card" style="border-left: 5px solid #16a34a;">
          📦 <b>${v.producto}</b><br>
          📍 <b>Origen flete:</b> ${v.origen} ➔ <b>Destino:</b> ${v.destino}<br>
          💰 <b>Valor del Viaje:</b> $${v.valor}<br>
          📏 <b>Distancia Vial Real:</b> ${v.distanciaKm ? v.distanciaKm.toFixed(1) : 0} km<br>

          <button class="btn-postular" onclick="postular('${v._id}')">
            🚚 Postularme al flete
          </button>
        </div>
      `;
    });

    document.getElementById("lista").innerHTML = html;

  } catch(err) {
    console.error("Error cargando radar de ofertas:", err);
    document.getElementById("lista").innerHTML = "<p>❌ Error sincronizando el radar de ofertas.</p>";
  }
}

// 🔹 POSTULARSE AL VIAJE (Se envía hacia el backend corregido)
async function postular(id){
  try {
    const res = await fetch("/trips/postular/" + id, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        nombre: localStorage.getItem("nombre"),
        telefono: localStorage.getItem("telefono"),
        dni: localStorage.getItem("dni"),
        patente1: localStorage.getItem("patente1")
      })
    });

    if(res.ok){
      alert("✅ ¡Postulación enviada correctamente al cliente flete!");
    } else {
      alert("❌ Ocurrió un problema al enviar la postulación");
    }
  } catch(e) {
    alert("Error de red");
  }
}

// 🔹 SUBIR FOTO CHOFER
async function subirFoto(){
  const input = document.getElementById("foto");
  if(!input.files[0]){ alert("Seleccioná una foto primero"); return; }

  const formData = new FormData();
  // 🔥 CORREGIDO: Clave adaptada a lo que procesa tu Multer en el backend
  formData.append("foto", input.files[0]);

  const id = localStorage.getItem("choferId");

  try {
    const res = await fetch(`/drivers/${id}/foto`, {
      method:"POST",
      body:formData
    });

    if(res.ok){
      alert("✅ Foto de perfil cargada con éxito");
      location.reload();
    } else {
      alert("Error subiendo el archivo");
    }
  } catch(e) {
    console.error(e);
  }
}

// ======================
// 🔄 CICLO DE INICIALIZACIÓN UNIFICADO Y SEGURO
// ======================
navigator.geolocation.getCurrentPosition(async (pos) => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  // Guardamos las coordenadas iniciales del teléfono
  localStorage.setItem("lat", lat);
  localStorage.setItem("lng", lng);

  // Levantamos el mapa y el radar de fletes en orden secuencial sin desbordes
  iniciarMapa(lat, lng);
  
  // Ejecutamos el perfil primero para asegurar las variables en localStorage
  await mostrarPerfil();
  
  // Teniendo las coordenadas y el choferId, lanzamos el radar vial
  cargarCargas();
}, (err) => {
  console.error("GPS Denegado o bloqueado por el dispositivo móvil:", err);
  alert("Por favor habilite los permisos de ubicación GPS para ver las cargas en su zona.");
});

</script>
</body>
</html>
