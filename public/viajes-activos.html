<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Viajes activos</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}
</style>

</head>

<body>

<h2>🚛 Viajes activos</h2>

<div id="lista">Cargando...</div>

<script>

async function cargar(){

try{

const res = await fetch("/trips");

// 🔴 VALIDAR RESPUESTA
if(!res.ok){
throw new Error("Error HTTP " + res.status);
}

const viajes = await res.json();

let html = "";

viajes.forEach(v=>{

if(v.estado === "EN_VIAJE"){

html += `
<div class="card">

<b>${v.producto || "-"}</b><br>
${v.origen || "-"} → ${v.destino || "-"}<br>

👨‍✈️ ${v.chofer?.nombre || "Sin asignar"}

<br><br>

<button onclick="verMapa('${v._id}')">
Ver en mapa
</button>

</div>
`;

}

});

// 🔴 SI NO HAY VIAJES
if(html === ""){
html = "<p>No hay viajes activos</p>";
}

document.getElementById("lista").innerHTML = html;

}catch(error){

console.error("❌ Error cargando viajes:", error);

document.getElementById("lista").innerHTML =
"<p>Error cargando viajes</p>";

}

}

// 🔹 IR AL MAPA CON ID
function verMapa(id){
window.location = "mapa.html?id=" + id;
}

// 🔄 ACTUALIZACIÓN AUTOMÁTICA (cada 10s)
setInterval(cargar, 10000);

cargar();

</script>

</body>
</html>
