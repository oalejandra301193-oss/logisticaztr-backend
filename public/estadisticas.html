<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Estadísticas - LogisticaZTR</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:30px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin:10px;
  border-radius:10px;
}

.numero{
  font-size:35px;
}
</style>

</head>

<body>

<h1>📊 Estadísticas del sistema</h1>

<div class="card">
Cargas publicadas
<div class="numero" id="cargas">0</div>
</div>

<div class="card">
Viajes activos
<div class="numero" id="activos">0</div>
</div>

<div class="card">
Viajes finalizados
<div class="numero" id="finalizados">0</div>
</div>

<div class="card">
Choferes trabajando
<div class="numero" id="choferes">0</div>
</div>

<script>
const API = "https://logisticaztr-backend.onrender.com";
const token = localStorage.getItem("token");

// 🔒 VALIDACIÓN ADMIN
if(!token){
  alert("No autorizado");
  window.location = "/login-admin.html";
}

// =======================
// CARGAR ESTADÍSTICAS
// =======================
async function cargar(){
  try{
    const res = await fetch(`${API}/trips`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });
    
    if(!res.ok) throw new Error("Error al cargar viajes");

    const viajes = await res.json();

    let activos = 0;
    let finalizados = 0;
    let choferes = new Set();

    viajes.forEach(v=>{
      // Estados consistentes con backend
      if(v.estado === "EN_VIAJE" || v.estado === "EN_CAMINO") activos++;
      if(v.estado === "FINALIZADO" || v.estado === "ENTREGADO") finalizados++;
      if(v.choferNombre) choferes.add(v.choferNombre);
    });

    document.getElementById("cargas").innerText = viajes.length;
    document.getElementById("activos").innerText = activos;
    document.getElementById("finalizados").innerText = finalizados;
    document.getElementById("choferes").innerText = choferes.size;

  }catch(err){
    console.error(err);
    document.getElementById("cargas").innerText = "❌";
    document.getElementById("activos").innerText = "❌";
    document.getElementById("finalizados").innerText = "❌";
    document.getElementById("choferes").innerText = "❌";
  }
}

cargar();
</script>

</body>
</html>
