<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cargas publicadas</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}
</style>

</head>

<body>

<h2>📦 Cargas publicadas</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("https://TU-BACKEND.onrender.com/trips")
.then(res => res.json())
.then(viajes => {
  console.log(viajes);

  // acá renderizás en pantalla
});
const viajes = await res.json()

let html=""

viajes.forEach(v=>{

if(v.estado === "PUBLICADO"){

html += `
<div class="card">

<b>${v.producto}</b><br>
${v.origen} → ${v.destino}<br>
💰 $${v.valor}<br>

👤 ${v.clienteNombre || "-"}

<br><br>

📨 Postulaciones: ${v.postulaciones?.length || 0}

</div>
`
}

})

document.getElementById("lista").innerHTML = html

}

cargar()

</script>

</body>
</html>
