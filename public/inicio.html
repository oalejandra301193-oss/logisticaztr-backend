<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logística ZTR - Bienvenido</title>

  <style>
    /* Reset general */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fondo de pantalla ultra oscuro para la PC */
    body {
      background: #090d16; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* 📱 CONTENEDOR CELULAR (Fijo con forma de teléfono flotante en la PC) */
    .celular-container {
      width: 100%;
      max-width: 390px;     /* Ancho real de un smartphone moderno */
      height: 740px;        /* Alto fijo para simular el celular en la PC */
      background: #090d16;  /* Fondo negro mate idéntico a tu foto del móvil */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 25px 25px 25px;
      position: relative;
      overflow: hidden;
      border-radius: 32px;  /* Bordes redondeados de smartphone */
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); /* Sombra flotante premium */
    }

    /* 📱 ADAPTACIÓN AUTOMÁTICA PARA EL CELULAR REAL */
    /* Cuando detecta que la pantalla mide menos de 480px (un móvil), elimina los bordes y toma el 100% */
    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .celular-container {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        padding: 50px 25px 30px 25px;
      }
    }

    /* Superior: Identidad visual */
    .header-branding {
      text-align: center;
      z-index: 2;
    }

    h1 {
      color: white;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sub {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* 🔥 LOGO CENTRAL "ZTR" - TEXTO CSS IDENTICO A TU CAPTURA */
    .logo-central-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2;
    }

    .logo-badge {
      background: linear-gradient(135deg, #1d4ed8, #0b1329);
      width: 120px;
      height: 120px;
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.45), 
                  0 0 0 6px rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .logo-texto-ztr {
      font-size: 34px;
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
      line-height: 1;
    }

    .logo-texto-sub {
      font-size: 10px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 2.5px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* Centro-Abajo: Grupo de Botoneras */
    .buttons-group {
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 5px;
    }

    .btn-perfil {
      width: 100%;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-in-out;
    }

    /* 🟠 Botón: Publicar sin registrarse */
    .publicar-anonimo {
      background: #f59e0b;
      color: white;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
    }

    .publicar-anonimo:hover {
      background: #d97706;
      transform: translateY(-2px);
    }

    /* 🟢 Botón: Cliente Registrado */
    .cliente {
      background: #10b981;
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    }

    .cliente:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    /* 🔵 Botón: Chofer */
    .chofer {
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
    }

    .chofer:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .btn-perfil:active {
      transform: translateY(1px);
    }

    /* Bloque Inferior: Panel administrativo */
    .footer-section {
      text-align: center;
      z-index: 2;
    }

    .admin {
      background: rgba(31, 41, 55, 0.5);
      color: #9ca3af;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin:hover {
      background: #1f2937;
      color: white;
    }
  </style>
</head>
<body>

  <!-- 📱 CONTENEDOR SMARTPHONE ADAPTABLE -->
  <div class="celular-container">
    
    <!-- Encabezado corporativo -->
    <div class="header-branding">
      <h1>LOGÍSTICA ZTR</h1>
      <div class="sub">Plataforma Logística Inteligente</div>
    </div>

    <!-- Centro: Logo en recuadro azul -->
    <div class="logo-central-container">
      <div class="logo-badge">
        <span class="logo-texto-ztr">ZTR</span>
        <span class="logo-texto-sub">LOGÍSTICA</span>
      </div>
    </div>

    <!-- Grupo de ingresos unificado -->
    <div class="buttons-group">
      
      <!-- Opción A: Publicar directo sin registro -->
      <button class="btn-perfil publicar-anonimo" onclick="window.location='/cliente-portal.html'">
        Publicar Carga Rápida
      </button>

      <!-- Opción B: Cliente registrado tradicional -->
      <button class="btn-perfil cliente" onclick="window.location='/login-cliente.html'">
        Ingresar como Cliente
      </button>

      <!-- Opción C: Chofer registrado obligatorio -->
      <button class="btn-perfil chofer" onclick="window.location='/login-chofer.html'">
        Ingresar como Chofer
      </button>
      
    </div>

    <!-- Acceso Técnico Administrativo -->
    <div class="footer-section">
      <button class="admin" onclick="window.location='/login.html'">
        Acceso Admin
      </button>
    </div>

  </div>

</body>
</html>
