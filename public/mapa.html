<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa Logístico</title>

<link rel="stylesheet" href="https://unpkg.com"/>
<script src="https://unpkg.com"></script>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

#mapa{
  height:600px; /* Un poco más alto para mejor visibilidad de despacho */
  width:100%;
  border-radius:10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<h2>🗺️ Centro de Monitoreo: Mapa Logístico</h2>

<div id="mapa"></div>

<script>

// 🔹 MAPA BASE (Centrado en Argentina de forma predeterminada)
let mapa = L.map("mapa").setView([-34.6,-58.4], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
  maxZoom:19 
}).addTo(mapa);

// 🔹 ARRAYS PARA CONTROLAR MARCADORES DINÁMICOS
let cargasMarkers = [];
let marcadoresCamiones = {}; // Objeto asociativo { choferId: marcador }

// ==========================================
// 🔹 1. RENDERIZAR CARGAS PUBLICADAS DISPONIBLES
// ==========================================
async function cargarMapaCargas(){
  try{
    const res = await fetch("/trips/mapa-cargas");
    const cargas = await res.json();

    // Limpiar marcadores anteriores para evitar duplicaciones
    cargasMarkers.forEach(m => mapa.removeLayer(m));
    cargasMarkers = [];

    cargas.forEach(c=>{
      if(!c.lat || !c.lng) return;

      // Inyectamos marcador de carga (marcador azul estándar nativo e infalible)
      const marker = L.marker([parseFloat(c.lat), parseFloat(c.lng)]).addTo(mapa);
      marker.bindPopup(`
        <b>📦 Carga Disponible</b><br>
        <b>Producto:</b> ${c.producto || "-"}<br>
        <b>Flete:</b> $${c.valor ? c.valor.toLocaleString('es-AR') : 0}
      `);

      cargasMarkers.push(marker);
    });

  } catch(err) {
    console.error("❌ Error cargando cargas en el mapa:", err);
  }
}

// ==========================================
// 🔹 2. RENDERIZAR FLOTA DE CAMIONES EN TIEMPO REAL (REPARADO)
// ==========================================
async function cargarCamiones(){
  try{
    // 🔥 CORREGIDO: Cambiado de /trips a /drivers para leer la ubicacion real de Driver.js
    const res = await fetch("/drivers");
    const choferes = await res.json();

    let idsNuevos = new Set();

    choferes.forEach(d=>{
      // 🔥 CORREGIDO: Evaluamos el GPS real guardado en el array del modelo de choferes
      if(d.ultimaUbicacion && d.ultimaUbicacion.lat && d.ultimaUbicacion.lng){
        
        const lat = parseFloat(d.ultimaUbicacion.lat);
        const lng = parseFloat(d.ultimaUbicacion.lng);
        idsNuevos.add(d._id);

        if(!isNaN(lat) && !isNaN(lng)) {
          
          if(marcadoresCamiones[d._id]){
            // Si el camión ya estaba en pantalla, solo movemos su posición suavemente
            marcadoresCamiones[d._id].setLatLng([lat, lng]);
          } else {
            // Si es la primera vez que se reporta el camión, creamos su marcador nativo
            // Para asegurar que cargue de una, usamos el marcador por defecto y le ponemos un popup descriptivo
            const marker = L.marker([lat, lng]).addTo(mapa);
            marker.bindPopup(`
              <b>🚛 Camión en Ruta</b><br>
              <b>Chofer:</b> ${d.nombre || "Chofer"} ${d.apellido || ""}<br>
              <b>DNI:</b> ${d.dni || "-"}<br>
              <b>Patente:</b> ${d.patente1 || "-"}<br>
              <b>Estado:</b> <span style="color:${d.disponible ? '#10b981':'#ef4444'}; font-weight:bold;">${d.disponible ? 'Disponible':'Ocupado'}</span>
            `);
            
            marcadoresCamiones[d._id] = marker;
          }
        }
      }
    });

    // 3. LIMPIEZA AUTOMÁTICA: Si un chofer se desconecta, removemos su camión del mapa
    for (let id in marcadoresCamiones) {
      if (!idsNuevos.has(id)) {
        mapa.removeLayer(marcadoresCamiones[id]);
        delete marcadoresCamiones[id];
      }
    }

  } catch(err) {
    console.error("❌ Error sincronizando camiones en el mapa:", err);
  }
}

// ==========================================
// 🔹 CICLO DE ARRANQUE Y REFRESH AUTOMÁTICO
// ==========================================
cargarMapaCargas();
cargarCamiones();

// Sincronización continua cada 5 segundos para monitoreo estable
setInterval(cargarCamiones, 5000);

</script>

</body>
</html>
