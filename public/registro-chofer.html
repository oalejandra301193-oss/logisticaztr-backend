<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Registro Chofer</title>

<style>
/* Body oscuro y centrado */
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f172a;
  color: #ffffff;
}

/* Contenedor centrado con sombra y bordes suaves */
.container {
  background: #1e293b;
  padding: 40px 30px;
  border-radius: 16px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Título grande y centrado */
h2 {
  margin-bottom: 30px;
  font-size: 26px;
  text-align: center;
  font-weight: 600;
}

/* Inputs grandes y cómodos para celular */
input {
  width: 100%;
  padding: 16px 14px;
  margin: 12px 0;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  background: #0f172a;
  color: #ffffff;
  box-sizing: border-box;
}

/* Placeholder más claro */
input::placeholder {
  color: #a1a1aa;
}

/* Botón destacado y grande */
button {
  width: 100%;
  padding: 16px;
  margin-top: 16px;
  background: #2ecc71;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background: #27ae60;
}

/* Ajustes responsivos adicionales */
@media (max-width: 400px) {
  .container {
    padding: 30px 20px;
  }
  h2 {
    font-size: 24px;
  }
  input, button {
    font-size: 16px;
    padding: 14px;
  }
}
</style>

</head>

<body>

<h2>Registro de Chofer</h2>

<input id="nombre" placeholder="Nombre">

<input id="apellido" placeholder="Apellido">

<input id="dni" placeholder="DNI">

<input id="telefono" placeholder="Teléfono">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Contraseña">

<button onclick="registrar()">Crear cuenta</button>

<script>

async function registrar(){

const data = {

nombre:document.getElementById("nombre").value,
apellido:document.getElementById("apellido").value,
dni:document.getElementById("dni").value,
telefono:document.getElementById("telefono").value,
email:document.getElementById("email").value,
password:document.getElementById("password").value

};

const res = await fetch("https://logisticaztr-backend.onrender.com/api/auth/chofer/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

if(!res.ok){
alert("Error al registrar");
return;
}

alert("Chofer registrado correctamente");

window.location="login-chofer.html";

}

</script>

</body>

</html>
