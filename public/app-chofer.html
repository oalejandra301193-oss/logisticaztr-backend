<!DOCTYPE html> 
<html>

<head>
<meta charset="UTF-8">
<title>App Chofer ZTR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin:10px;
  border-radius:10px;
}

input{
  display:block;
  margin:5px 0;
  padding:8px;
}

button{
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h3>Mi perfil</h3>

<div id="formPerfil">
  <input id="nombre" placeholder="Nombre">
  <input id="apellido" placeholder="Apellido">
  <input id="dni" placeholder="DNI">
  <input id="telefono" placeholder="Telefono">
  <input id="patente1" placeholder="Patente 1">
  <input id="patente2" placeholder="Patente 2">
  <input id="patente3" placeholder="Patente 3 (opcional)">
  <button onclick="guardarPerfil()">Guardar perfil</button>
</div>

<h3>Foto de perfil</h3>
<input type="file" id="foto">
<button onclick="subirMiFoto()">Subir foto</button>

<div id="miPerfil"></div>
<div id="panelCargas" style="display:none;"></div>
<div id="ranking"></div>

<button onclick="window.location='portal-chofer.html'">
Ver cargas publicadas
</button>

<h2>🚛 Cargas disponibles</h2>
<div id="viajes" style="display:none;"></div>

<div id="mapa" style="height:300px; margin-bottom:20px;"></div>

<div id="empresa"></div>

<script>

navigator.geolocation.getCurrentPosition(pos=>{
localStorage.setItem("lat", pos.coords.latitude);
localStorage.setItem("lng", pos.coords.longitude);
});

function verMapa(lat,lng){
window.open(`https://www.google.com/maps?q=${lat},${lng}`);
}

function iniciarMapa(viajes){

const lat = localStorage.getItem("lat") || -34.6;
const lng = localStorage.getItem("lng") || -58.4;

const map = L.map('mapa').setView([lat,lng], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// 📍 marcador chofer
L.marker([lat,lng]).addTo(map)
.bindPopup("Tu ubicación");

// 📦 cargas
viajes.forEach(v=>{

if(v.origenlat && v.origenlng && v.estado==="PUBLICADO"){

L.marker([v.origenlat,v.origenlng]).addTo(map)
.bindPopup(`📦 ${v.producto}`);

}

});

}

function mostrarCargas(){
  document.getElementById("viajes").style.display = "block";
  cargarViajes();
}

async function mostrarMiPerfil(){

const choferId = localStorage.getItem("choferId");

if(!choferId) return;

const res = await fetch("/choferes/"+choferId);
const data = await res.json();

let html = `
<div class="card">

<img src="/uploads/choferes/${data.foto || 'default.png'}" width="100"><br><br>

<b>${data.nombre || ""} ${data.apellido || ""}</b><br>
DNI: ${data.dni || "-"}<br>
Tel: ${data.telefono || "-"}<br>
Patente 1: ${data.patente1 || "-"}<br>
Patente 2: ${data.patente2 || "-"}<br>
Patente 3: ${data.patente3 || "-"}<br>

</div>
`;

document.getElementById("miPerfil").innerHTML = html;

}
mostrarMiPerfil();

async function guardarPerfil(){
  const choferId = localStorage.getItem("choferId");
  if(!choferId){
    alert("Error: no estás logueado correctamente");
    return;
  }

  const perfil = {
    nombre: document.getElementById("nombre").value,
    apellido: document.getElementById("apellido").value,
    dni: document.getElementById("dni").value,
    telefono: document.getElementById("telefono").value,
    patente1: document.getElementById("patente1").value,
    patente2: document.getElementById("patente2").value,
    patente3: document.getElementById("patente3").value
  };

  const res = await fetch("/choferes/"+choferId+"/perfil", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(perfil)
  });

  if(res.ok){
    alert("Perfil guardado correctamente");
    localStorage.setItem("dni", perfil.dni);
    document.getElementById("formPerfil").style.display="none";
    document.getElementById("panelCargas").style.display="block";
    cargarViajes();
  } else {
    alert("Error al guardar perfil");
  }
}

// Mostrar panel de cargas si el perfil ya está completo
async function verificarPerfil(){
  const choferId = localStorage.getItem("choferId");
  if(!choferId) return;

  const res = await fetch("/choferes/"+choferId);
  const yo = await res.json();

  if(yo && yo.dni && yo.patente1){
    document.getElementById("formPerfil").style.display="none";
    document.getElementById("panelCargas").style.display="block";
    cargarViajes();
  } else {
    document.getElementById("formPerfil").style.display="block";
    document.getElementById("panelCargas").style.display="none";
  }
}

verificarPerfil();

async function cargarViajes(){

const res = await fetch("/trips");
const viajes = await res.json();

const lat = localStorage.getItem("lat");
const lng = localStorage.getItem("lng");

let lista = [];

// 🔥 FILTRAR SOLO PUBLICADAS (IMPORTANTÍSIMO)
viajes.forEach(v=>{

if(v.estado === "PUBLICADO"){ // 👈 CLAVE

let distancia = 9999;

if(lat && lng && v.origenlat && v.origenlng){
distancia = Math.sqrt(
Math.pow(lat - v.origenlat,2) +
Math.pow(lng - v.origenlng,2)
);
}

lista.push({...v,distancia});

}

});

// 🔥 ORDENAR POR DISTANCIA
lista.sort((a,b)=> a.distancia - b.distancia);

// 🔥 MOSTRAR
let html="";

lista.forEach(v=>{

html+=`
<div class="card">
📦 ${v.producto}<br>
📍 ${v.origen}<br>
💰 $${v.valor}<br>
📏 Distancia: ${v.distancia.toFixed(2)} km<br>

<button onclick="postular('${v._id}')">
Postularme
</button>

<button onclick="verMapa(${v.origenlat},${v.origenlng})">
Ver en mapa
</button>

</div>
`;

});

iniciarMapa(lista);

document.getElementById("viajes").innerHTML = html;

}

async function postular(id){

const nombre = localStorage.getItem("nombre");
const telefono = localStorage.getItem("telefono");
const dni = localStorage.getItem("dni");
const patente1 = localStorage.getItem("patente1");

const res = await fetch("/trips/postular/"+id,{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
nombre,
telefono,
dni,
patente1
})
});

if(res.ok){
alert("Postulación enviada");
}else{
alert("Error al postular");
}

}

// Subir foto de perfil
async function subirMiFoto(){

  const input = document.getElementById("foto");

  if(!input.files || input.files.length===0){
    alert("Seleccioná una foto primero");
    return;
  }

  const formData = new FormData();
  formData.append("archivo", input.files[0]);
  formData.append("tipo","chofer"); // 🔥 ESTO ES CLAVE

  const choferId = localStorage.getItem("choferId");

  if(!choferId){
    alert("Error: no estás logueado correctamente");
    return;
  }

  const res = await fetch("/choferes/"+choferId+"/foto",{
    method:"POST",
    body:formData
  });

  if(res.ok){
    alert("Foto subida");
    location.reload();
  }else{
    alert("Error al subir foto");
  }

}

// Empresa y ranking
async function empresa(){
  const res = await fetch("/api/company");
  const data = await res.json();
  document.getElementById("empresa").innerHTML=`
    <hr>
    <h3>Empresa</h3>
    <p>${data.name}</p>
    <p>Tel: ${data.phone}</p>
    <p>Email: ${data.email}</p>
    <p>Soporte: ${data.support}</p>
  `;
}
empresa();

async function mejorChofer(){
  const res=await fetch("/ranking");
  const data=await res.json();
  if(data.length){
    document.getElementById("ranking").innerHTML="🏆 Chofer del mes: "+data[0]._id;
  }
}
mejorChofer();
</script>

</body>
</html>
