<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Registro Chofer</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0f172a;
color:white;
}

.container{
background:#1e293b;
padding:30px;
border-radius:12px;
width:90%;
max-width:400px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h2{
margin-bottom:20px;
text-align:center;
}

input{
display:block;
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#2ecc71;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

</style>

</head>

<body>

<h2>Registro de Chofer</h2>

<input id="nombre" placeholder="Nombre">

<input id="apellido" placeholder="Apellido">

<input id="dni" placeholder="DNI">

<input id="telefono" placeholder="Teléfono">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Contraseña">

<button onclick="registrar()">Crear cuenta</button>

<script>

async function registrar(){

const data = {

nombre:document.getElementById("nombre").value,
apellido:document.getElementById("apellido").value,
dni:document.getElementById("dni").value,
telefono:document.getElementById("telefono").value,
email:document.getElementById("email").value,
password:document.getElementById("password").value

};

const res = await fetch("https://logisticaztr-backend.onrender.com/api/auth/chofer/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

if(!res.ok){
alert("Error al registrar");
return;
}

alert("Chofer registrado correctamente");

window.location="login-chofer.html";

}

</script>

</body>

</html>
