<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ranking de Clientes - Logística ZTR</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}
h2 {
  margin-bottom:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  border-left: 5px solid #64748b;
  box-shadow: 0 4px 6px rgba(0,0,0,0.15);
}
.top{
  color:#10b981;
  font-size:18px;
  font-weight:bold;
}
.oro {
  border-left-color: #f59e0b; /* Borde dorado premium para el primer puesto */
}
.no-datos {
  padding: 20px;
  background: #1e293b;
  border-radius: 10px;
  text-align: center;
  color: #9ca3af;
}
</style>

</head>
<body>

<h2>🏆 Podio y Ranking de Clientes (Métricas de Carga)</h2>

<div id="lista">Evaluando volumen operativo de facturación...</div>

<script>
const token = localStorage.getItem("token");

// 🔒 VALIDACIÓN ADMINISTRATIVA DE ENTRADA
if(!token){
  alert("Acceso denegado: No autorizado");
  window.location = "/login-admin.html";
}

// ==========================================
// CALCULAR E INDIZAR MÉTRICAS DEL RANKING
// ==========================================
async function cargar(){
  try{
    // 🔥 CORREGIDO: URL absoluta de Render removida para pasar a ruta relativa nativa /trips
    const res = await fetch("/trips", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if(!res.ok) throw new Error("Error al cargar viajes");

    const viajes = await res.json();
    let clientes = {};

    viajes.forEach(v=>{
      if(!v.clienteCUIT) return;

      if(!clientes[v.clienteCUIT]){
        clientes[v.clienteCUIT] = {
          nombre: v.clienteNombre || "Cliente Anónimo",
          viajes: 0,
          total: 0
        };
      }

      clientes[v.clienteCUIT].viajes++;
      clientes[v.clienteCUIT].total += v.valor || 0;
    });

    // Ordenamos de mayor a menor cantidad de fletes
    const ranking = Object.values(clientes).sort((a,b)=> b.viajes - a.viajes);

    let html = "";

    if(ranking.length === 0) {
      html = "<div class='no-datos'>📋 No se registran fletes completados en el sistema para computar métricas corporativas.</div>";
      document.getElementById("lista").innerHTML = html;
      return;
    }

    ranking.forEach((c, index)=>{
      const esPrimero = index === 0;
      const claseCard = esPrimero ? "oro" : "";
      const claseTexto = esPrimero ? "top" : "";

      // 🔥 OPTIMIZADO: Formateamos el dinero con separadores de millares nativos para una lectura gerencial prolija
      const facturacionLimpia = c.total ? c.total.toLocaleString('es-AR') : "0";

      html+=`
      <div class="card ${claseCard}">
        <div class="${claseTexto}">
          #${index+1} 👤 Razón Social: <b>${c.nombre}</b>
        </div>
        <br>
        📦 <b>Volumen de Operaciones:</b> ${c.viajes} fletes solicitados
        <br>
        💰 <b>Inversión Total en Logística:</b> $${facturacionLimpia}
      </div>
      `;
    });

    document.getElementById("lista").innerHTML = html;

  }catch(err){
    console.error("❌ Error procesando ranking corporativo:", err);
    document.getElementById("lista").innerHTML = "<div class='no-datos'>❌ Error crítico al sincronizar métricas desde MongoDB Atlas.</div>";
  }
}

// Ejecución inicial de arranque automático
cargar();
</script>

</body>
</html>
