<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Choferes activos</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}
</style>

</head>

<body>

<h2>🟢 Choferes activos</h2>

<div id="lista"></div>

<script>

async function cargar(){

try{

// 🔥 AHORA SI: drivers reales
const res = await fetch("/drivers");
const drivers = await res.json();

let html = "";

drivers.forEach(d=>{

// SOLO DISPONIBLES
if(d.disponible){

html += `
<div class="card">

👨‍✈️ ${d.nombre || "-"} ${d.apellido || ""} <br>
📞 ${d.telefono || "-"} <br>
🚛 ${d.patente1 || "-"} <br>

📍 ${d.ultimaUbicacion ? "Ubicación activa" : "Sin ubicación"}

</div>
`;

}

});

document.getElementById("lista").innerHTML = html;

}catch(err){
console.error(err);
}

}

cargar();

</script>

</body>
</html>
