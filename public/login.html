<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Admin - Logistica ZTR</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;

background:url("https://images.unsplash.com/photo-1601584115197-04ecc0da31d7");
background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
}

.caja{

background:rgba(0,0,0,0.75);
padding:50px;
border-radius:12px;
text-align:center;
color:white;
width:320px;

}

h1{
font-size:32px;
margin-bottom:10px;
}

input{

width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;

}

button{

width:100%;
padding:12px;
background:#2ecc71;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;

}

button:hover{
background:#27ae60;
}

</style>

</head>

<body>

<div class="caja">

<h1>🚚 Logistica ZTR</h1>
<p>Panel Administrador</p>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Ingresar</button>

</div>

<script>

async function login(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

if(!email || !password){
alert("Ingrese email y contraseña")
return
}

const res = await fetch("/api/auth/admin/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

})

if(!res.ok){

alert("Email o contraseña incorrectos")
return

}

const data = await res.json()

localStorage.setItem("token",data.token)

window.location="/admin.html"

}


const data=await res.json()

localStorage.setItem("token",data.token)

window.location="/admin.html"


</script>

</body>
</html>
