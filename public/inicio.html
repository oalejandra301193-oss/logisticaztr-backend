<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logística ZTR - Bienvenido</title>

  <style>
    /* Reset e inicialización */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* 📱 CONTENEDOR CON TAMAÑO FIJO DE CELULAR + IMAGEN DE CAMIÓN DE RUTA ARGENTINA */
    .celular-container {
      width: 100%;
      max-width: 400px;
      height: 100vh; /* Se estira a pantalla completa en el celular */
      max-height: 840px; 
      
      /* FONDO: Camión pesado en ruta con un filtro oscuro encima para que resalten los botones */
      background: linear-gradient(to bottom, rgba(9, 13, 22, 0.6), rgba(9, 13, 22, 0.95)), 
                  url("https://unsplash.com");
      background-size: cover;
      background-position: center;
      
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px 25px 30px 25px;
      position: relative;
      overflow: hidden;
    }

    /* Superior: Encabezado */
    .header-branding {
      text-align: center;
      z-index: 2;
    }

    h1 {
      color: white;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    .sub {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    /* 🔥 LOGO CENTRAL CORPORATIVO "ZTR" EN TEXTO REAL */
    .logo-central-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2;
    }

    .logo-badge {
      background: linear-gradient(135deg, #1d4ed8, #0b1329);
      width: 120px;
      height: 120px;
      border-radius: 30px; /* Bordes redondeados modernos */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.5), 
                  0 0 0 6px rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    /* Estilo metalizado para las letras ZTR */
    .logo-texto-ztr {
      font-size: 32px;
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Subtexto logístico inferior */
    .logo-texto-sub {
      font-size: 9px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 2px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Centro-Abajo: Botones de acceso */
    .buttons-group {
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-perfil {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-in-out;
    }

    /* Botón Cliente */
    .cliente {
      background: #10b981;
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .cliente:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    /* Botón Chofer */
    .chofer {
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .chofer:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .btn-perfil:active {
      transform: translateY(1px);
    }

    /* Bloque Inferior: Panel administrativo */
    .footer-section {
      text-align: center;
      z-index: 2;
    }

    .admin {
      background: rgba(31, 41, 55, 0.6);
      color: #9ca3af;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin:hover {
      background: #1f2937;
      color: white;
    }
  </style>
</head>
<body>

  <!-- 📱 CONTENEDOR VIRTUAL DE SMARTPHONE -->
  <div class="celular-container">
    
    <!-- Superior: Encabezado -->
    <div class="header-branding">
      <h1>LOGÍSTICA ZTR</h1>
      <div class="sub">Plataforma Logística Inteligente</div>
    </div>

    <!-- 🔥 Centro: Logo Corporativo Real "ZTR" -->
    <div class="logo-central-container">
      <div class="logo-badge">
        <span class="logo-texto-ztr">ZTR</span>
        <span class="logo-texto-sub">LOGÍSTICA</span>
      </div>
    </div>

    <!-- Centro-Abajo: Botonera -->
    <div class="buttons-group">
      <button class="btn-perfil cliente" onclick="window.location='/login-cliente.html'">
        Ingresar como Cliente
      </button>

      <button class="btn-perfil chofer" onclick="window.location='/login-chofer.html'">
        Ingresar como Chofer
      </button>
    </div>

    <!-- Inferior: Panel Técnico de Acceso -->
    <div class="footer-section">
      <button class="admin" onclick="window.location='/login.html'">
        Acceso Admin
      </button>
    </div>

  </div>

</body>
</html>
