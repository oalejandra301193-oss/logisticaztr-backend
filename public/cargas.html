<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Cargas publicadas</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

h2{
margin-bottom:20px;
}

.card{

background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:10px;

}

button{

padding:8px 12px;
margin-top:8px;
margin-right:5px;
border:none;
border-radius:6px;
cursor:pointer;

}

.ver{
background:#2563eb;
color:white;
}

.eliminar{
background:#dc2626;
color:white;
}

.estado{

padding:4px 8px;
border-radius:5px;
font-size:12px;
margin-left:10px;

}

.publicado{background:#334155}
.en_viaje{background:#16a34a}
.finalizado{background:#64748b}

</style>

</head>

<body>

<h2>📦 App Cliente</h2>

<button onclick="mostrarFormulario()">
Publicar carga
</button>

<button onclick="verViaje()">
Ver carga en viaje
</button>

<div id="contenido"></div>

<h3>Publicar carga</h3>

<div class="card">

<input id="producto" placeholder="Producto"><br><br>

<input id="origen" placeholder="Ciudad de origen"><br><br>

<input id="destino" placeholder="Ciudad de destino"><br><br>

<input id="distancia" placeholder="Distancia KM" readonly><br><br>

<input id="valor" placeholder="Valor del viaje"><br><br>

<select id="tipoCarga">

<option value="granel">Granel</option>
<option value="bolsas">Mercadería embolsada</option>
<option value="pallet">Palletizada</option>
<option value="general">Carga general</option>
<option value="pie">Tabla por pie</option>

</select>

<br><br>

<input id="cantidad" placeholder="Cantidad (toneladas / bultos / pallets / pies)">


<button onclick="calcularDistancia()">Calcular distancia</button>

<button onclick="calcularFlete()">
Calcular flete
</button>

<button onclick="crearCarga()">Publicar carga</button>


</div>


<script>

async function pagarAdelanto(){

const id = prompt("ID del viaje");

const monto = prompt("Monto del adelanto");

await fetch("/trips/adelanto/"+id,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
monto
})

});

alert("Adelanto registrado");

}

async function cargarCargas(){

const res = await fetch("/trips")
const cargas = await res.json()

let html=""

cargas.forEach(c=>{

let estadoClass="publicado"

if(c.estado==="EN_VIAJE"){
estadoClass="en_viaje"
}

if(c.estado==="FINALIZADO"){
estadoClass="finalizado"
}

html+=`

<div class="card">

<b>Producto:</b> ${c.producto}

<br>

<b>Origen:</b> ${c.origen}

<br>

<b>Destino:</b> ${c.destino}

<br>

<b>Distancia:</b> ${c.distanciaKm || "-"} km

<br>

<b>Precio:</b> $${c.valor || "-"}

<br>

<b>Estado:</b>
<span class="estado ${estadoClass}">
${c.estado || "PUBLICADO"}
</span>

<br><br>

<b>Chofer:</b>
${c.choferNombre || "Sin asignar"}

<br><br>

<button class="ver" onclick="verPostulaciones('${c._id}')">
Ver postulaciones
</button>

<button class="eliminar" onclick="eliminarCarga('${c._id}')">
Eliminar carga
</button>

</div>

`

})

document.getElementById("lista").innerHTML=html

}

cargarCargas()

async function eliminarCarga(id){

if(!confirm("Eliminar carga?")) return

await fetch("/trips/"+id,{
method:"DELETE"
})

cargarCargas()

}

async function verPostulaciones(id){

const res = await fetch("/trips/"+id+"/postulaciones")
const postulaciones = await res.json()

if(postulaciones.length===0){

alert("No hay choferes postulados")

return

}

let texto="Choferes postulados:\n\n"

postulaciones.forEach(p=>{

texto+=p.nombre+" - "+p.telefono+"\n"

})

alert(texto)

}

</script>

</body>

</html>
