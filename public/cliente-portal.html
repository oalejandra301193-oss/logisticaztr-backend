<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portal Cliente - Logistica ZTR</title>
<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  padding:30px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
  padding:10px 20px;
  background:#3498db;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin:5px;
}

.estado{
  display:inline-block;
  padding:3px 6px;
  border-radius:5px;
  font-size:12px;
  margin-left:10px;
  color:white;
}

.publicado{background:#334155;}
.en_viaje{background:#16a34a;}
.finalizado{background:#64748b;}
</style>
</head>

<body>

<h2>Portal Cliente</h2>

<div class="card">
<h3>📦 Publicar carga</h3>
<button onclick="window.location='cliente.html'">Publicar nueva carga</button>
</div>

<div class="card">
<h3>🚚 Mis viajes</h3>
<div id="misViajes">Cargando...</div>
</div>

<div class="card">
<h3>💰 Adelantos</h3>
<button onclick="pagarAdelanto()">Pagar adelanto</button>
</div>

<div class="card">
<h3>📁 Documentación</h3>
<input type="file" id="archivo">
<button onclick="subirDocumento()">Subir documento</button>
</div>

<script>
const API = "https://logisticaztr-backend.onrender.com";

// ======================
// Cargar viajes del cliente
// ======================
async function cargarViajes(){
  try{
    const res = await fetch(`${API}/trips`);
    const viajes = await res.json();
    if(!Array.isArray(viajes) || viajes.length === 0){
      document.getElementById("misViajes").innerHTML = "<p>No tenés viajes</p>";
      return;
    }

    let html = "";
    viajes.forEach(v=>{
      if(v.clienteNombre){
        let estadoClass="publicado";
        if(v.estado==="EN_VIAJE") estadoClass="en_viaje";
        if(v.estado==="FINALIZADO") estadoClass="finalizado";

        html += `
          <p>
            <b>Producto:</b> ${v.producto || "-"}<br>
            <b>Origen → Destino:</b> ${v.origen || "-"} → ${v.destino || "-"}<br>
            <b>Chofer:</b> ${v.choferNombre || "Sin asignar"}<br>
            Estado: <span class="estado ${estadoClass}">${v.estado || "-"}</span>
          </p>
          <hr>
        `;
      }
    });

    document.getElementById("misViajes").innerHTML = html;
  }catch(err){
    console.error(err);
    document.getElementById("misViajes").innerHTML = "❌ Error cargando viajes";
  }
}

// ======================
// Subir documento
// ======================
async function subirDocumento(){
  const file = document.getElementById("archivo").files[0];
  if(!file){ alert("Seleccioná un archivo primero"); return; }

  const formData = new FormData();
  formData.append("archivo", file);

  try{
    const res = await fetch(`${API}/subir-documento`,{
      method:"POST",
      body:formData
    });
    if(!res.ok) throw new Error("Error al subir documento");
    alert("Documento guardado ✅");
    document.getElementById("archivo").value = "";
  }catch(err){
    console.error(err);
    alert("❌ Error al subir documento");
  }
}

// ======================
// Pagar adelanto
// ======================
async function pagarAdelanto(){
  const id = prompt("ID del viaje");
  if(!id){ alert("ID inválido"); return; }

  const monto = prompt("Monto del adelanto");
  if(!monto || isNaN(monto)){ alert("Monto inválido"); return; }

  try{
    const res = await fetch(`${API}/trips/adelanto/${id}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({monto})
    });
    if(!res.ok) throw new Error("Error al registrar adelanto");
    alert("Adelanto registrado ✅");
  }catch(err){
    console.error(err);
    alert("❌ Error al registrar adelanto");
  }
}

// ======================
// Inicializar
// ======================
cargarViajes();
</script>

</body>
</html>
