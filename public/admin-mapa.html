<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Mapa de Camiones - LogisticaZTR</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:0;
padding:20px;
}

#map{
height:600px;
width:100%;
border-radius:10px;
}

</style>

</head>

<body>

<h2>🛰 Camiones en tiempo real</h2>

<div id="map"></div>

<script>

const params = new URLSearchParams(window.location.search);
const viajeId = params.get("id");

const map = L.map("map").setView([-34.6,-58.38],5);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19
}
).addTo(map);

let markers = {};

const camionIcon = L.icon({
iconUrl:"https://cdn-icons-png.flaticon.com/512/743/743922.png",
iconSize:[40,40]
});

async function cargarCamiones(){

const res = await fetch("/trips/mapa");
const data = await res.json();

data.forEach(trip=>{

if(viajeId && trip._id !== viajeId) return;

if(!trip.lat || !trip.lng) return;

if(!markers[trip._id]){

markers[trip._id] = L.marker(
[trip.lat,trip.lng],
{icon:camionIcon}
)
.addTo(map)
.bindPopup(
"🚛 "+trip.producto+
"<br>📍 "+trip.origen+
" → "+trip.destino
);

}else{

markers[trip._id].setLatLng([trip.lat,trip.lng]);

}

});

}

setInterval(cargarCamiones,5000);

cargarCamiones();

</script>

</body>
</html>
