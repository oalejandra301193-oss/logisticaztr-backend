<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Postulaciones</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}
</style>

</head>

<body>

<h2>📋 Postulaciones</h2>

<div id="lista">Cargando...</div>

<script>

async function cargar(){

try{

const res = await fetch("/trips");

// 🔴 VALIDAR RESPUESTA
if(!res.ok){
throw new Error("Error HTTP " + res.status);
}

const viajes = await res.json();

let html = "";

viajes.forEach(v=>{

if(v.postulaciones && v.postulaciones.length > 0){

v.postulaciones.forEach(p=>{

html += `
<div class="card">

🚛 <b>${v.producto || "-"}</b><br>
${v.origen || "-"} → ${v.destino || "-"}

<br><br>

👤 ${p.nombre || "Sin nombre"}<br>
📞 ${p.telefono || "-"}

</div>
`;

});

}

});

// 🔴 SI NO HAY POSTULACIONES
if(html === ""){
html = "<p>No hay postulaciones todavía</p>";
}

document.getElementById("lista").innerHTML = html;

}catch(error){

console.error("❌ Error cargando postulaciones:", error);

document.getElementById("lista").innerHTML =
"<p>Error cargando postulaciones</p>";

}

}

// 🔄 ACTUALIZAR CADA 15 SEGUNDOS
setInterval(cargar, 15000);

cargar();

</script>

</body>
</html>
