<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cargas publicadas - ZTR</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}
h2{
  margin-bottom:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  border-left: 5px solid #64748b;
}
.card:hover{
  background:#334155;
}
/* Colores de estado visuales para el operador */
.estado-pendiente { border-left-color: #f59e0b; }
.estado-publicado { border-left-color: #10b981; }

.badge-estado {
  float: right;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: bold;
}
.bg-pendiente { background: #7c2d12; color: #fdba74; }
.bg-publicado { background: #064e3b; color: #6ee7b7; }

.detalle{
  margin-top:10px;
  padding:10px;
  background:#020617;
  border-radius:8px;
  display:none;
}
.detalle div{
  margin-top:5px;
  padding:5px;
  border:1px solid #334155;
  border-radius:5px;
}
</style>

</head>
<body>

<h2>📦 Control de Cargas y Postulaciones</h2>

<div id="lista">Cargando fletes...</div>

<script>

// Cargar cargas activas en el sistema
async function cargar(){
  try{
    const res = await fetch("/trips");
    const viajes = await res.json();

    // 🔥 OPTIMIZADO: Ahora filtramos tanto las PENDIENTES como las PUBLICADAS 
    // para que puedas hacer pruebas completas de punta a punta
    const activas = viajes.filter(v => v.estado === "PUBLICADO" || v.estado === "PENDIENTE");

    let html = "";

    if(activas.length === 0){
      html = "<p>No hay cargas registradas en este momento</p>";
    }

    activas.forEach(v => {
      const esPendiente = v.estado === "PENDIENTE";
      const claseCard = esPendiente ? "estado-pendiente" : "estado-publicado";
      const claseBadge = esPendiente ? "bg-pendiente" : "bg-publicado";

      html += `
        <div class="card ${claseCard}" onclick="toggle('${v._id}', event)">
          <span class="badge-estado ${claseBadge}">${v.estado}</span>
          <b>📦 ${v.producto || "-"}</b><br>
          📍 Origen: ${v.origen} ➔ Destino: ${v.destino}<br>
          Ancho/Ruta Vial: ${v.distanciaKm || "-"} km<br>
          💰 Flete Estimado: $${v.valor || "-"}
          
          <div id="det-${v._id}" class="detalle">
            <hr style="border-color: #1e293b; margin: 10px 0;">
            <b>👤 Datos del Cliente de Carga</b><br>
            Nombre: ${v.clienteNombre || "-"}<br>
            Teléfono: ${v.clienteTelefono || "-"}<br>
            CUIT: ${v.clienteCUIT || "-"}<br>
            
            <!-- 🔥 REPARADO: Variables mapeadas con el nombre real de tu base de datos -->
            🚚 Cargar en: ${v.clienteDireccionCarga || v.direccionCarga || "-"}<br>
            📍 Descargar en: ${v.clienteDireccionDescarga || v.direccionDescarga || "-"}<br><br>

            <b>🚛 Postulaciones de Choferes Recibidas</b><br>
            ${
              v.postulaciones && v.postulaciones.length > 0
              ? v.postulaciones.map(p => `
                <div>
                  👤 <b>Chofer:</b> ${p.nombre || "-"}<br>
                  📞 <b>Teléfono:</b> ${p.telefono || "-"}<br>
                  🪪 <b>DNI:</b> ${p.dni || "-"}<br>
                  🚛 <b>Patente Chasis:</b> ${p.patente1 || "-"}
                </div>
              `).join("")
              : "<i>Sin transportistas postulados por el momento</i>"
            }
          </div>
        </div>
      `;
    });

    document.getElementById("lista").innerHTML = html;

  }catch(error){
    console.error("❌ Error en la carga de fletes:", error);
    document.getElementById("lista").innerHTML = "❌ Error al sincronizar datos logísticos";
  }
}

// Mostrar/ocultar detalles de forma inteligente sin interrumpir clicks internos
function toggle(id, event){
  // Si hacen clic en una postulación interna, evitamos colapsar el menú
  if (event.target.tagName === 'BUTTON') return;
  
  const div = document.getElementById("det-"+id);
  div.style.display = (div.style.display === "block") ? "none" : "block";
}

// Ejecutar carga al abrir página
cargar();

</script>

</body>
</html>
