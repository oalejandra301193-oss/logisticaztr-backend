<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Choferes</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin:10px;
border-radius:10px;
}

img{
width:80px;
height:80px;
object-fit:cover;
border-radius:50%;
margin-bottom:10px;
}

button{
padding:8px;
margin-top:5px;
}

</style>

</head>

<body>

<h2>🚛 Choferes registrados</h2>

<div id="lista"></div>

<script>

const token = localStorage.getItem("token");

// 🔒 VALIDACIÓN ADMIN
if(!token){
alert("No autorizado");
window.location = "/login-admin.html";
}

// =======================
// CARGAR CHOFERES
// =======================

async function cargar(){

try{

const res = await fetch("/drivers");

if(!res.ok){
throw new Error("Error obteniendo choferes");
}

const drivers = await res.json();

let html = "";

drivers.forEach(d=>{

const foto = d.foto
? "/uploads/choferes/" + d.foto
: "https://cdn-icons-png.flaticon.com/512/149/149071.png";

html+=`

<div class="card">

<img src="${foto}">

<br>

<b>${d.nombre || "Sin nombre"} ${d.apellido || ""}</b>

<br>

🪪 DNI: ${d.dni || "-"}

<br>

📞 Tel: ${d.telefono || "-"}

<br>

🚛 Patente 1: ${d.patente1 || "-"}

<br>

🚛 Patente 2: ${d.patente2 || "-"}

<br>

🚛 Patente 3: ${d.patente3 || "-"}

<br>

🟢 Disponible: ${d.disponible ? "SI" : "NO"}

<br><br>

<input type="file" id="file-${d._id}">
<button onclick="subirArchivo('${d._id}')">📤 Subir archivo</button>

<br><br>

<div>

${
d.archivos && d.archivos.length > 0
? d.archivos.map(a =>
`<a href="/uploads/choferes/${a}" target="_blank">📄 Ver archivo</a><br>`
).join("")
: "Sin archivos"
}

</div>

</div>

`;

});

document.getElementById("lista").innerHTML = html;

}catch(err){

console.error(err);
alert("Error cargando choferes");

}

}

cargar();

// =======================
// SUBIR ARCHIVO (ADMIN)
// =======================

async function subirArchivo(id){

const input = document.getElementById("file-"+id);

if(!input.files[0]){
alert("Seleccioná un archivo");
return;
}

const formData = new FormData();
formData.append("archivo", input.files[0]);

try{

const res = await fetch("/choferes/"+id+"/archivo",{
method:"POST",
headers:{
"Authorization": "Bearer " + token
},
body:formData
});

if(res.ok){
alert("Archivo subido");
cargar();
}else{
alert("Error al subir archivo");
}

}catch(err){
console.error(err);
alert("Error de conexión");
}

}

</script>

</body>
</html>
