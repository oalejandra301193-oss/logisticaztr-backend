<script>

async function cargar(){

try{

const res = await fetch("https://logisticaztr-backend.onrender.com/trips");

const viajes = await res.json();

const publicadas = viajes.filter(v => v.estado === "PUBLICADO");

console.log(viajes);

let html="";

publicadas.forEach(v => {
  html += `
    <div class="card">
      📦 ${v.producto}<br>
      📍 ${v.origen} → ${v.destino}<br>
      💰 $${v.valor}
    </div>
  `;
});

viajes.forEach(v=>{

html += `
<div class="card">

<b>${v.producto || "-"}</b><br>
${v.origen} → ${v.destino}<br>
💰 $${v.valor}<br>

👤 ${v.clienteNombre || "-"}

<br><br>

📨 Postulaciones: ${v.postulaciones?.length || 0}

</div>
`;

});

document.getElementById("lista").innerHTML = html;

}catch(error){

console.error("Error cargando publicados:", error);

}

}

cargar();

</script>
