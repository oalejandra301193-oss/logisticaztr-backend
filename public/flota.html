<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Flota - Logística ZTR</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
  margin: 0;
}

.contenedor-flota {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  height: calc(100vh - 100px); /* Ocupa el alto disponible de la pantalla */
}

#lista-choferes {
  flex: 1;
  overflow-y: auto; /* Permite hacer scroll en la lista de camiones independientemente */
  padding-right: 10px;
}

#mapa{
  flex: 2;
  border-radius:10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  border-left: 5px solid #64748b;
}

.disponible-si { border-left-color: #16a34a; }
.disponible-no { border-left-color: #dc2626; }
</style>

</head>

<body>

<h2>🚛 Monitoreo de Flota en Tiempo Real</h2>

<div class="contenedor-flota">
  <!-- Columna izquierda: Listado -->
  <div id="lista-choferes">Cargando flota...</div>
  
  <!-- Columna derecha: Mapa -->
  <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// Inicializamos el mapa centrado en Argentina de forma predeterminada
let mapa = L.map("mapa").setView([-34.6, -58.4], 5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(mapa);

// Guardamos los marcadores usando un Objeto asociativo { choferId: marcador }
// Esto evita borrar el mapa cada 5 segundos y permite actualizar posiciones suavemente
let marcadoresActivos = {};

async function cargarFlota(){
  try{
    const res = await fetch("/drivers");
    const drivers = await res.json();

    let html = "";
    let idsNuevos = new Set();

    drivers.forEach(d=>{
      idsNuevos.add(d._id);
      
      const claseDispo = d.disponible ? "disponible-si" : "disponible-no";

      // 1. Armamos la tarjeta visual del chofer
      html += `
        <div class="card ${claseDispo}">
          👨‍✈️ <b>${d.nombre || "Sin nombre"}</b><br>
          🪪 DNI: ${d.dni || "-"}<br>
          🟢 Disponible: ${d.disponible ? "SÍ" : "NO"}<br>
          📍 Última conexión: ${d.ultimaUbicacion ? "En línea" : "Desconectado"}
        </div>
      `;

      // 2. Lógica del Marcador en el Mapa
      // Validamos estrictamente que posea propiedades de latitud y longitud válidas
      if(d.ultimaUbicacion && d.ultimaUbicacion.lat && d.ultimaUbicacion.lng){
        const nuevaLat = parseFloat(d.ultimaUbicacion.lat);
        const nuevaLng = parseFloat(d.ultimaUbicacion.lng);

        if(!isNaN(nuevaLat) && !isNaN(nuevaLng)) {
          
          if(marcadoresActivos[d._id]) {
            // Si el camionero ya estaba en el mapa, solo actualizamos su posición sin cerrar su popup
            marcadoresActivos[d._id].setLatLng([nuevaLat, nuevaLng]);
          } else {
            // Si es la primera vez que aparece el camión, creamos su marcador desde cero
            const marker = L.marker([nuevaLat, nuevaLng]).addTo(mapa);
            marker.bindPopup(`<b>🚛 Chofer:</b> ${d.nombre || "Chofer"}<br><b>DNI:</b> ${d.dni || "-"}`);
            marcadoresActivos[d._id] = marker;
          }
        }
      }
    });

    // 3. Limpieza: Si un chofer se borra o se desconecta, removemos su marcador del mapa
    for (let id in marcadoresActivos) {
      if (!idsNuevos.has(id)) {
        mapa.removeLayer(marcadoresActivos[id]);
        delete marcadoresActivos[id];
      }
    }

    document.getElementById("lista-choferes").innerHTML = html;

  }catch(err){
    console.error("❌ Error actualizando el mapa de flota:", err);
  }
}

// Actualizaciones controladas e inteligentes cada 5 segundos
setInterval(cargarFlota, 5000);
cargarFlota();

</script>

</body>
</html>
