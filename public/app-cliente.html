<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>App Cliente ZTR</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin:10px 0;
  border-radius:10px;
}

input{
  display:block;
  margin:5px 0;
  padding:8px;
  width:100%;
}

button{
  padding:10px;
  margin-top:10px;
  cursor:pointer;
}

img{
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📦 App Cliente</h2>

<h3>👤 Mi perfil</h3>

<div id="formPerfil" class="card">

<input id="nombreApellido" placeholder="Nombre y apellido">
<input id="comercio" placeholder="Nombre del comercio">
<input id="telefono" placeholder="Teléfono">
<input id="direccionDescarga" placeholder="Dirección de descarga">
<input id="direccionCarga" placeholder="Dirección de Carga">

<input type="file" id="logoCliente">
<input id="cuit" placeholder="CUIT" style="display:none;">

<button onclick="guardarPerfil()">Guardar perfil</button>

</div>

<div id="perfilVista"></div>

<button onclick="irPortal()" id="btnPortal" style="display:none;">
Ir a mi portal
</button>

<div id="ranking"></div>

<script>

// =======================
// CREAR / EDITAR PERFIL
// =======================

async function guardarPerfil(){

const clienteId = localStorage.getItem("clienteId")

// 🔴 SI NO HAY ID → NO PERMITIR
if(!clienteId){
  alert("Tenés que iniciar sesión")
  window.location = "login-cliente.html"
  return
}

const nombre = document.getElementById("nombreApellido").value
const comercio = document.getElementById("comercio").value
const telefono = document.getElementById("telefono").value
const direccionDescarga = document.getElementById("direccionDescarga").value
const direccionCarga = document.getElementById("direccionCarga").value

if(!nombre){
  alert("El nombre es obligatorio");
  return;
}

const formData = new FormData();

formData.append("nombre",nombre)
formData.append("comercio",comercio)
formData.append("telefono",telefono)
formData.append("direccionDescarga",direccionDescarga)
formData.append("direccionCarga",direccionCarga)

// 🔥 ARCHIVO
const file = document.getElementById("logoCliente").files[0]
if(file){
  formData.append("logo",file)
}

// 🔥 SIEMPRE EDITAR (NUNCA CREAR)
const res = await fetch("/clientes/"+clienteId,{
  method:"PUT",
  body:formData
})

if(res.ok){

  alert("Perfil actualizado")

  mostrarPerfil()

}else{
  alert("Error guardando perfil")
}

}

// =======================
// MOSTRAR PERFIL
// =======================

async function mostrarPerfil(){

const id = localStorage.getItem("clienteId")

if(!id) return

const res = await fetch("/clientes/"+id)
const c = await res.json()
console.log("CLIENTE:", c)

let html = `
<div class="card">

${c.logo 
      ? `<img src="${API}/uploads/clientes/${c.logo}" width="80"><br><br>`
      : ""
    }
<b>${c.nombre}</b><br>
🏪 ${c.comercio || "-"}<br>
📞 ${c.telefono || "-"}<br>
CUIT: ${c.cuit || "-"}<br>

<br>

<button onclick="editarPerfil()">Editar perfil</button>

</div>
`

document.getElementById("perfilVista").innerHTML = html

document.getElementById("formPerfil").style.display = "none"
document.getElementById("btnPortal").style.display = "block"

// 🔥 OCULTAR CUIT (NO SE TOCA MÁS)
document.getElementById("cuit").style.display = "none"

}

// =======================
// EDITAR PERFIL
// =======================

function editarPerfil(){
document.getElementById("formPerfil").style.display = "block"
}

// =======================
// IR AL PORTAL
// =======================

function irPortal(){
window.location = "cliente-portal.html"
}

// =======================
// VERIFICAR PERFIL
// =======================

async function verificarPerfil(){

const id = localStorage.getItem("clienteId")

if(!id) return

const res = await fetch("/clientes/"+id)

if(res.ok){
mostrarPerfil()
}

}

verificarPerfil()

// =======================
// RANKING
// =======================

async function ranking(){

const res = await fetch("/trips")
const viajes = await res.json()

let clientes = {}

viajes.forEach(v=>{

if(!v.clienteCUIT) return

if(!clientes[v.clienteCUIT]){
clientes[v.clienteCUIT]={
nombre:v.clienteNombre,
viajes:0
}
}

clientes[v.clienteCUIT].viajes++

})

const lista = Object.values(clientes)
.sort((a,b)=> b.viajes - a.viajes)

let html = "<h3>🏆 Ranking clientes</h3>"

lista.slice(0,5).forEach((c,i)=>{
html += `${i+1}. ${c.nombre} (${c.viajes} viajes)<br>`
})

document.getElementById("ranking").innerHTML = html

}

ranking()

</script>

</body>
</html>
