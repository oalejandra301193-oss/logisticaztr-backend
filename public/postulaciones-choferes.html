<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Choferes postulados</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:10px;
}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.aceptar{
background:#2ecc71;
color:white;
}

</style>

</head>

<body>

<h2>📋 Choferes postulados</h2>

<div id="lista"></div>

<script>

async function cargar(){

try{

const res = await fetch("/trips");
const viajes = await res.json();

let html = "";

// 🔥 SOLO VIAJES PUBLICADOS O PENDIENTES
viajes
.filter(v => v.estado === "PUBLICADO" || v.estado === "PENDIENTE")
.forEach(v=>{

if(!v.postulaciones || v.postulaciones.length === 0) return;

html += `
<div class="card">
<b>📦 ${v.producto}</b><br>
📍 ${v.origen} → ${v.destino}<br>
💰 $${v.valor}<br><br>
`;

v.postulaciones.forEach(p=>{

html += `
<div style="border-top:1px solid #334155;margin-top:10px;padding-top:10px;">
👤 ${p.nombre}<br>
📞 ${p.telefono}<br>
🚛 ${p.patente1 || "-"}<br>

<button class="aceptar" onclick="aceptar('${v._id}','${p.nombre}','${p.telefono}','${p.dni}','${p.patente1}')">
✅ Aceptar chofer
</button>
</div>
`;

});

html += `</div>`;

});

document.getElementById("lista").innerHTML = html || "No hay postulaciones";

}catch(err){
console.error(err);
alert("Error cargando postulaciones");
}

}

// 🔥 ACEPTAR CHOFER
async function aceptar(id,nombre,telefono,dni,camion){

try{

await fetch("/trips/aceptar-chofer/"+id,{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:new URLSearchParams({
nombre,
telefono,
dni,
camion
})
});

alert("Chofer asignado");

cargar();

}catch(err){
console.error(err);
alert("Error al aceptar");
}

}

cargar();

</script>

</body>
</html>
