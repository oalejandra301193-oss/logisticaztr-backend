<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cargas publicadas - ZTR</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}
h2{
  margin-bottom:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}
.card:hover{
  background:#334155;
}
.detalle{
  margin-top:10px;
  padding:10px;
  background:#020617;
  border-radius:8px;
  display:none;
}
.detalle div{
  margin-top:5px;
  padding:5px;
  border:1px solid #334155;
  border-radius:5px;
}
</style>

</head>
<body>

<h2>📦 Cargas publicadas</h2>

<div id="lista"></div>

<script>

// Cargar cargas publicadas
async function cargar(){
  try{
    const res = await fetch("/trips");
    const viajes = await res.json();

    const publicadas = viajes.filter(v => v.estado === "PUBLICADO");

    let html = "";

    if(publicadas.length === 0){
      html = "<p>No hay cargas publicadas</p>";
    }

    publicadas.forEach(v => {
      html += `
        <div class="card" onclick="toggle('${v._id}')">
          <b>📦 ${v.producto || "-"}</b><br>
          📍 ${v.origen} → ${v.destino}<br>
          📏 ${v.distanciaKm || "-"} km<br>
          💰 $${v.valor || "-"}
          
          <div id="det-${v._id}" class="detalle">
            <hr>
            <b>👤 Cliente</b><br>
            Nombre: ${v.clienteNombre || "-"}<br>
            Teléfono: ${v.clienteTelefono || "-"}<br>
            CUIT: ${v.clienteCUIT || "-"}<br>
            DirecciónDescarga: ${v.clienteDireccionDescarga || "-"}<br>
            DirecciónCarga: ${v.clienteDireccionCarga || "-"}<br><br>

            <b>🚛 Postulaciones</b><br>
            ${
              v.postulaciones && v.postulaciones.length > 0
              ? v.postulaciones.map(p => `
                <div>
                  👤 ${p.nombre || "-"}<br>
                  📞 ${p.telefono || "-"}<br>
                  🚛 ${p.patente1 || "-"}
                </div>
              `).join("")
              : "Sin postulaciones"
            }
          </div>
        </div>
      `;
    });

    document.getElementById("lista").innerHTML = html;

  }catch(error){
    console.error("ERROR:", error);
    document.getElementById("lista").innerHTML = "❌ Error cargando datos";
  }
}

// Mostrar/ocultar detalles
function toggle(id){
  const div = document.getElementById("det-"+id);
  div.style.display = (div.style.display === "block") ? "none" : "block";
}

// Ejecutar carga al abrir página
cargar();

</script>

</body>
</html>
