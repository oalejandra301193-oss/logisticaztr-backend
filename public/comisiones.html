<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Comisiones - LogisticaZTR</title>
<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>💸 Comisiones</h2>
<div id="lista"></div>

<script>
const API = "https://logisticaztr-backend.onrender.com";
const token = localStorage.getItem("token");

// 🔒 VALIDACIÓN ADMIN
if(!token){
  alert("No autorizado");
  window.location = "/login-admin.html";
}

// =======================
// CARGAR COMISIONES
// =======================
async function cargar(){
  try{
    const res = await fetch(`${API}/trips`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if(!res.ok) throw new Error("Error al cargar viajes");

    const viajes = await res.json();
    let html = "";

    viajes.forEach(v=>{
      if(v.valor){
        const comision = (v.valor * 0.05).toFixed(2);
        html += `
        <div class="card">
          📦 <b>Producto:</b> ${v.producto || "-"}<br>
          💰 <b>Valor carga:</b> $${v.valor || 0}<br>
          💸 <b>Comisión 5%:</b> $${comision}<br>
          🧾 <small>Detalle: 5% del valor total de la carga</small>
        </div>
        `;
      }
    });

    document.getElementById("lista").innerHTML = html;

  }catch(err){
    console.error(err);
    document.getElementById("lista").innerHTML = "❌ Error cargando comisiones";
  }
}

cargar();
</script>

</body>
</html>
