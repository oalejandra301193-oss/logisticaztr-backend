<!DOCTYPE html> 
<html>

<head>
<meta charset="UTF-8">
<title>App Chofer ZTR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin:10px;
  border-radius:10px;
}

input{
  display:block;
  margin:5px 0;
  padding:8px;
}

button{
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h3>Mi perfil</h3>

<div id="formPerfil">
  <input id="nombre" placeholder="Nombre">
  <input id="apellido" placeholder="Apellido">
  <input id="dni" placeholder="DNI">
  <input id="telefono" placeholder="Telefono">
  <input id="patente1" placeholder="Patente 1">
  <input id="patente2" placeholder="Patente 2">
  <input id="patente3" placeholder="Patente 3 (opcional)">
  <button onclick="guardarPerfil()">Guardar perfil</button>
</div>

<h3>Foto de perfil</h3>
<input type="file" id="foto">
<button onclick="subirMiFoto()">Subir foto</button>

<div id="empresa"></div>
<div id="ranking"></div>

<h2>🚛 Cargas disponibles</h2>
<div id="viajes"></div>

<div id="panelCargas" style="display:none;"></div>

<script>
async function guardarPerfil(){
  const choferId = localStorage.getItem("choferId");
  if(!choferId){
    alert("Error: no estás logueado correctamente");
    return;
  }

  const perfil = {
    nombre: document.getElementById("nombre").value,
    apellido: document.getElementById("apellido").value,
    dni: document.getElementById("dni").value,
    telefono: document.getElementById("telefono").value,
    patente1: document.getElementById("patente1").value,
    patente2: document.getElementById("patente2").value,
    patente3: document.getElementById("patente3").value
  };

  const res = await fetch("/choferes/"+choferId+"/perfil", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(perfil)
  });

  if(res.ok){
    alert("Perfil guardado correctamente");
    document.getElementById("formPerfil").style.display="none";
    document.getElementById("panelCargas").style.display="block";
    cargarViajes();
  } else {
    alert("Error al guardar perfil");
  }
}

// Mostrar panel de cargas si el perfil ya está completo
async function verificarPerfil(){
  const choferId = localStorage.getItem("choferId");
  if(!choferId) return;

  const res = await fetch("/choferes/"+choferId);
  const yo = await res.json();

  if(yo && yo.dni && yo.patente1){
    document.getElementById("formPerfil").style.display="none";
    document.getElementById("panelCargas").style.display="block";
    cargarViajes();
  } else {
    document.getElementById("formPerfil").style.display="block";
    document.getElementById("panelCargas").style.display="none";
  }
}

verificarPerfil();

async function cargarViajes(){
  const res=await fetch("/trips");
  const viajes=await res.json();
  let html="";
  viajes.forEach(v=>{
    if(v.estado==="PENDIENTE"){
      html+=`
      <div class="card">
        📦 ${v.producto}<br>
        📍 ${v.origen}<br>
        💰 $${v.valor}<br>
        <button onclick="postular('${v._id}')">Postularme</button>
      </div>`;
    }
  });
  document.getElementById("viajes").innerHTML=html;
}

async function postular(id){
  const dni=localStorage.getItem("dni");
  const res = await fetch("/trips/postular",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({tripId:id,dni})
  });
  if(res.ok) alert("Postulación enviada");
  else alert("Error al postularte");
}

// Subir foto de perfil
async function subirMiFoto(){

  const input = document.getElementById("foto");

  if(!input.files || input.files.length===0){
    alert("Seleccioná una foto primero");
    return;
  }

  const formData = new FormData();
  formData.append("archivo", input.files[0]);
  formData.append("tipo","chofer"); // 🔥 ESTO ES CLAVE

  const choferId = localStorage.getItem("choferId");

  if(!choferId){
    alert("Error: no estás logueado correctamente");
    return;
  }

  const res = await fetch("/choferes/"+choferId+"/foto",{
    method:"POST",
    body:formData
  });

  if(res.ok){
    alert("Foto subida");
    location.reload();
  }else{
    alert("Error al subir foto");
  }

}

// Empresa y ranking
async function empresa(){
  const res = await fetch("/api/company");
  const data = await res.json();
  document.getElementById("empresa").innerHTML=`
    <hr>
    <h3>Empresa</h3>
    <p>${data.name}</p>
    <p>Tel: ${data.phone}</p>
    <p>Email: ${data.email}</p>
    <p>Soporte: ${data.support}</p>
  `;
}
empresa();

async function mejorChofer(){
  const res=await fetch("/ranking");
  const data=await res.json();
  if(data.length){
    document.getElementById("ranking").innerHTML="🏆 Chofer del mes: "+data[0]._id;
  }
}
mejorChofer();
</script>

</body>
</html>
