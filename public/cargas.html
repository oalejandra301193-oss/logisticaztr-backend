<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cliente sin usuario - Cargas</title>
<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

h2,h3{ margin-bottom:20px; }

.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

button{
  padding:8px 12px;
  margin-top:8px;
  margin-right:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.ver{ background:#2563eb; color:white; }
.eliminar{ background:#dc2626; color:white; }

.estado{
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  margin-left:10px;
}

.publicado{background:#334155}
.en_viaje{background:#16a34a}
.finalizado{background:#64748b}

input, select{
  width:100%;
  padding:8px;
  margin-top:5px;
  margin-bottom:10px;
  border-radius:6px;
  border:none;
}
</style>
</head>

<body>

<h2>📦 Cliente sin cuenta</h2>

<button onclick="window.location='registro-cliente.html'">Registrarme como cliente</button>
<button onclick="verViaje()">Ver carga en viaje</button>

<h3>Publicar carga</h3>
<div class="card">
<input id="producto" placeholder="Producto">
<input id="origen" placeholder="Ciudad de origen">
<input id="destino" placeholder="Ciudad de destino">
<input id="distancia" placeholder="Distancia KM" readonly>
<input id="valor" placeholder="Valor del viaje">
<select id="tipoCarga">
  <option value="granel">Granel</option>
  <option value="bolsas">Mercadería embolsada</option>
  <option value="pallet">Palletizada</option>
  <option value="general">Carga general</option>
  <option value="pie">Tabla por pie</option>
</select>
<input id="cantidad" placeholder="Cantidad (toneladas / bultos / pallets / pies)">

<!-- 🔒 CAMPOS OCULTOS PARA ALMACENAR LAS COORDENADAS REQUISITO -->
<input type="hidden" id="origenLat">
<input type="hidden" id="origenLng">
<input type="hidden" id="destinoLat">
<input type="hidden" id="destinoLng">

<button onclick="calcularDistancia()">Calcular distancia por carretera</button>
<button onclick="calcularFlete()">Calcular flete</button>
<button onclick="crearCarga()">Publicar carga</button>

<div id="lista"></div>
</div>

<h3>Datos del cliente</h3>
<div class="card">
<input id="nombreApellido" placeholder="Nombre y apellido">
<input id="comercio" placeholder="Nombre del comercio">
<input id="cuit" placeholder="CUIT" oninput="cargarCargas()">
<input id="telefono" placeholder="Teléfono">
<input id="direccionDescarga" placeholder="Dirección de descarga">
<input id="direccionCarga" placeholder="Dirección de Carga">
</div>

<script>
// ======================
// Cargar cargas vinculadas por CUIT
// ======================
async function cargarCargas(){
  const cuitInput = document.getElementById("cuit").value;
  const cuit = cuitInput.trim().replace(/\D/g,"");

  if(!cuit) return;

  const res = await fetch("/trips");
  const cargas = await res.json();

  const mias = cargas.filter(c => 
    (c.clienteCUIT || "").replace(/\D/g,"") === cuit
  );

  let html="";

  mias.forEach(c=>{
    let estadoClass="publicado";
    if(c.estado==="EN_VIAJE") estadoClass="en_viaje";
    if(c.estado==="FINALIZADO") estadoClass="finalizado";

    html+=`
      <div class="card">
        <b>Producto:</b> ${c.producto}<br>
        <b>Origen:</b> ${c.origen}<br>
        <b>Destino:</b> ${c.destino}<br>
        <b>Precio:</b> $${c.valor}<br>
        <b>Distancia:</b> ${c.distanciaKm || 0} km<br>
        <b>Estado:</b> <span class="estado ${estadoClass}">${c.estado}</span><br><br>

        <button class="ver" onclick="pagarAdelanto('${c._id}')">💳 Pagar Adelanto</button>
        <button class="eliminar" onclick="eliminarCarga('${c._id}')">Eliminar</button>
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

// ======================
// Crear carga (Alineado con el Backend)
// ======================
async function crearCarga(){
  const producto = document.getElementById("producto").value;
  const origen = document.getElementById("origen").value;
  const destino = document.getElementById("destino").value;
  const distancia = document.getElementById("distancia").value;
  const valor = document.getElementById("valor").value;
  const tipo = document.getElementById("tipoCarga").value;
  const cantidad = document.getElementById("cantidad").value;

  const nombre = document.getElementById("nombreApellido").value;
  const comercio = document.getElementById("comercio").value;
  const cuitInput = document.getElementById("cuit").value;
  const cuit = cuitInput.trim().replace(/\D/g,""); 
  const telefono = document.getElementById("telefono").value;
  const direccionDescarga = document.getElementById("direccionDescarga").value;
  const direccionCarga = document.getElementById("direccionCarga").value;

  // 🔒 Coordenadas extraídas de los campos ocultos
  const origenLat = document.getElementById("origenLat").value;
  const origenLng = document.getElementById("origenLng").value;
  const destinoLat = document.getElementById("destinoLat").value;
  const destinoLng = document.getElementById("destinoLng").value;

  if(!producto||!origen||!destino||!distancia||!valor||!tipo||!cantidad||
     !nombre||!comercio||!cuit||!telefono||!direccionCarga||!direccionDescarga||!origenLat){
    alert("⚠ Debe completar todos los datos y calcular la distancia vial antes de publicar");
    return;
  }

  const data = {
    producto, 
    origen, 
    destino, 
    distanciaKm: Number(distancia), // Convertido a número
    valor: Number(valor),           // Convertido a número
    tipoCarga: tipo, 
    cantidad: Number(cantidad),     // Convertido a número
    
    // Al no haber cuenta, se envía null y el backend creará el registro fantasma opcional
    clienteId: null, 

    // Coordenadas requeridas por Mongoose
    origenLat: Number(origenLat),
    origenLng: Number(origenLng),
    destinoLat: Number(destinoLat),
    destinoLng: Number(destinoLng),

    clienteNombre: nombre,
    clienteComercio: comercio,
    clienteCUIT: cuit,
    clienteTelefono: telefono,

    // Nombres alineados con las propiedades reales de tu backend
    direccionDescarga,
    direccionCarga,
    estado: "PENDIENTE"
  };

  const res = await fetch("/trips",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });

  if(!res.ok){ alert("❌ Error al guardar la carga"); return; }
  alert("✅ Carga enviada para aprobación");
  cargarCargas();
  
  // Limpiamos solo los campos de la carga, reteniendo los datos del cliente para su comodidad
  document.getElementById("producto").value = "";
  document.getElementById("origen").value = "";
  document.getElementById("destino").value = "";
  document.getElementById("distancia").value = "";
  document.getElementById("valor").value = "";
  document.getElementById("cantidad").value = "";
}

// ======================
// Eliminar carga
// ======================
async function eliminarCarga(id){
  if(!confirm("¿Desea eliminar esta carga?")) return;
  await fetch("/trips/"+id,{method:"DELETE"});
  cargarCargas();
}

// ======================
// CALCULAR DISTANCIA REAL POR CARRETERA (REPARADO)
// ======================
async function calcularDistancia(){
  const origen = document.getElementById("origen").value.trim();
  const destino = document.getElementById("destino").value.trim();
  if(!origen || !destino){ alert("Ingrese origen y destino"); return; }

  try {
    // 1. Buscamos las coordenadas del texto origen y destino en Nominatim
    // 🔥 CORREGIDO: Inyectada la ruta oficial de búsqueda /search?format=json&q=
    const res1 = await fetch(`https://openstreetmap.org{encodeURIComponent(origen)}`);
    const data1 = await res1.json();
    const res2 = await fetch(`https://openstreetmap.org{encodeURIComponent(destino)}`);
    const data2 = await res2.json();
    
    // Validación estricta porque Nominatim devuelve un Arreglo de resultados
    if(!data1 || data1.length === 0 || !data2 || data2.length === 0){ 
      alert("No se pudieron encontrar las coordenadas de las ciudades ingresadas. Escriba el nombre completo."); 
      return; 
    }

    // Leemos el primer resultado de la lista del mapa
    const lat1 = parseFloat(data1[0].lat), lon1 = parseFloat(data1[0].lon);
    const lat2 = parseFloat(data2[0].lat), lon2 = parseFloat(data2[0].lon);

    // Guardamos las coordenadas obtenidas en los inputs ocultos para enviárselas al backend
    document.getElementById("origenLat").value = lat1;
    document.getElementById("origenLng").value = lon1;
    document.getElementById("destinoLat").value = destinoLat = lat2;
    document.getElementById("destinoLng").value = lon2;

    // 2. Consultamos al servidor de mapas terrestre para saber la distancia exacta por asfalto
    // 🔥 CORREGIDO: Inyectada la ruta completa de enrutamiento automotor /routed-car/route/v1/driving/
    const urlOSRM = `https://openstreetmap.de{lon1},${lat1};${lon2},${lat2}?overview=false`;
    const resRoute = await fetch(urlOSRM);
    const dataRoute = await resRoute.json();

    if (dataRoute.code === "Ok" && dataRoute.routes && dataRoute.routes.length > 0) {
      const kmReales = dataRoute.routes[0].distance / 1000;
      document.getElementById("distancia").value = kmReales.toFixed(1);
    } else {
      alert("No se pudo trazar una ruta por asfalto entre estas dos ciudades.");
    }
  } catch(e) {
    console.error(e);
    alert("Error de conexión con el servidor de mapas geográficos");
  }
}


function calcularFlete(){
  const km = parseFloat(document.getElementById("distancia").value);
  const tipo = document.getElementById("tipoCarga").value;
  const cantidad = parseFloat(document.getElementById("cantidad").value);
  if(!km){ alert("Primero calcule la distancia"); return; }

  let tarifa = 0;
  if(tipo==="granel") tarifa=120;
  if(tipo==="bolsas") tarifa=140;
  if(tipo==="pallet") tarifa=160;
  if(tipo==="general") tarifa=150;
  if(tipo==="pie") tarifa=20;

  document.getElementById("valor").value = Math.round(km * tarifa * (cantidad||1));
}

// ======================
// Pagar adelanto moderno (Pasarela PayPal con redirección directa)
// ======================
async function pagarAdelanto(id){
  if(!id) { alert("ID de viaje inválido"); return; }

  const res = await fetch("/api/payments/crear-pago",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      tripId: id,
      tipo: "adelanto"
    })
  });

  const data = await res.json();

  if(!data.id){
    alert("Error de PayPal al procesar la solicitud de cobro");
    return;
  }

  // Redirección oficial segura a la interfaz de Sandbox de PayPal
  window.location.href = `https://paypal.com{data.id}`;
}

// ======================
// Ver carga en viaje
// ======================
async function verViaje(){
  const res = await fetch("/mis-viajes");
  const viajes = await res.json();
  if(!viajes.length){ alert("Todavía no tenés una carga en viaje"); return; }
  alert(`Carga en viaje:\nProducto: ${viajes[0].producto}\nEstado: ${viajes[0].estado}`);
}

// Inicializar al escribir CUIT
cargarCargas();
</script>

</body>
</html>
