<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Login Chofer - LogisticaZTR</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{

margin:0;
font-family:'Poppins',sans-serif;

height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
url("https://images.unsplash.com/photo-1601584115197-04ecc0da31d7");

background-size:cover;
background-position:center;

color:white;

}

.login-box{

background:rgba(0,0,0,0.85);

padding:40px;

border-radius:12px;

width:320px;

text-align:center;

box-shadow:0 0 20px rgba(0,0,0,0.5);

}

h2{
margin-top:0;
}

input{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:6px;

}

button{

width:100%;

padding:12px;

margin-top:15px;

border:none;

border-radius:6px;

background:#2980b9;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{
opacity:0.9;
}

.registro{

background:#27ae60;

}

</style>

</head>

<body>

<div class="login-box">

<h2>🚚 Ingreso Chofer</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="loginChofer()">Ingresar</button>

<p>No tenés cuenta?</p>

<button class="registro"
onclick="window.location='/registro-chofer.html'">
Registrarme
</button>

</div>

<script>

async function loginChofer(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

if(!email || !password){
alert("Complete email y contraseña")
return
}

const res = await fetch("https://logisticaztr-backend.onrender.com/api/auth/chofer/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

})

if(!res.ok){
alert("Email o contraseña incorrectos")
return
}

const data = await res.json()

localStorage.setItem("token",data.token)

window.location="/app-chofer.html"

}

</script>

</body>
</html>
