<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Clientes</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h2>👤 Clientes</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("https://logisticaztr-backend.onrender.com/clientes")
const clientes=await res.json()

let html=""

clientes.forEach(c=>{

html+=`

<div class="card">

Nombre: ${c.nombre || "-"}

<br>
CUIT: ${c.cuit || "-"}

<br>
Telefono: ${c.telefono || "-"}

<br>
Direccion comercial: ${c.direccion || "-"}

<br>
Viajes: ${c.viajes || 0}

<br><br>

<input type="file" id="file-${c._id}">
<button onclick="subirArchivo('${c._id}')">Subir archivo</button>

<br><br>

<div id="archivos-${c._id}">
${
  c.archivos && c.archivos.length > 0
  ? c.archivos.map(a =>
    `<a href="https://logisticaztr-backend.onrender.com/uploads/clientes/${a}" target="_blank">📄 Ver archivo</a><br>`
  ).join("")
  : "Sin archivos"
}
</div>

</div>

`

})

document.getElementById("lista").innerHTML=html

}

const esAdmin = true; // o validar token

if(!esAdmin){
document.getElementById("lista").innerHTML = "No autorizado";
return;
}

cargar()

async function subirArchivo(id){

const input = document.getElementById("file-"+id);

if(!input.files[0]){
alert("Seleccioná un archivo");
return;
}

const formData = new FormData();
formData.append("archivo", input.files[0]);

const res = await fetch("https://logisticaztr-backend.onrender.com/clientes/"+id+"/archivo",{
method:"POST",
headers:{
"Authorization": "Bearer " + localStorage.getItem("token")
},
body:formData
});

if(res.ok){
alert("Archivo subido");
cargar();
}else{
alert("Error al subir archivo");
}

}

</script>

</body>

</html>
