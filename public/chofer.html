<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Portal Chofer - Logística ZTR</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}
button{
padding:10px;
margin:5px;
}
</style>

</head>

<body>

<h2>🚛 Portal del Chofer</h2>

<button onclick="disponible()">🟢 Disponible</button>
<button onclick="noDisponible()">🔴 No disponible</button>

<div id="tripInfo"></div>

<br>

<button onclick="marcarCargado()">🚛 YA CARGUÉ</button>
<button onclick="marcarDescarga()">📦 DESCARGA REALIZADA</button>
<button onclick="finalizarViaje()">✅ FINALIZAR VIAJE</button>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

socket.on("nuevo-viaje",(data)=>{
alert("🚛 Nueva carga: "+data.origen+" → "+data.destino);
});

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

let tripActual = null;
let watchId = null;

// 🔹 CARGAR VIAJE
async function cargarViaje(){

const res = await fetch("/trips");
const viajes = await res.json();

tripActual = viajes.find(t => t.tokenChofer === token);

if(!tripActual){
document.body.innerHTML = "❌ Viaje no encontrado";
return;
}

mostrarViaje();

// si ya está en camino → activar GPS
if(tripActual.estado === "EN_CAMINO"){
iniciarSeguimiento();
}

}

// 🔹 MOSTRAR VIAJE
function mostrarViaje(){

document.getElementById("tripInfo").innerHTML = `
<p><b>Producto:</b> ${tripActual.producto}</p>
<p><b>Origen:</b> ${tripActual.origen}</p>
<p><b>Destino:</b> ${tripActual.destino}</p>
<p><b>Estado:</b> ${tripActual.estado}</p>
`;

}

// 🔹 GPS TRACKING LIMPIO
function iniciarSeguimiento(){

if(!navigator.geolocation){
alert("GPS no disponible");
return;
}

watchId = navigator.geolocation.watchPosition(async pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

// guardar ubicación del viaje
await fetch(`/trips/token/${token}/ubicacion`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({lat,lng})
});

console.log("📍 Ubicación enviada");

},{
enableHighAccuracy:true
});

}

// 🔹 MARCAR CARGA
async function marcarCargado(){

await fetch(`/trips/token/${token}/estado`,{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({estado:"EN_CAMINO"})
});

tripActual.estado="EN_CAMINO";
mostrarViaje();

iniciarSeguimiento();

alert("🚛 En camino");

}

// 🔹 MARCAR DESCARGA
async function marcarDescarga(){

if(watchId){
navigator.geolocation.clearWatch(watchId);
}

await fetch(`/trips/token/${token}/estado`,{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({estado:"ENTREGADO"})
});

tripActual.estado="ENTREGADO";
mostrarViaje();

alert("📦 Entregado");

}

// 🔹 FINALIZAR
async function finalizarViaje(){

if(!tripActual?._id){
alert("Error: sin ID");
return;
}

await fetch(`/trips/finalizar/${tripActual._id}`,{
method:"POST"
});

alert("✅ Viaje finalizado");
location.reload();

}

// 🔹 DISPONIBILIDAD
async function disponible(){

await fetch("/trips/chofer/disponibilidad",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
dni:tripActual?.chofer?.dni,
disponible:true
})
});

alert("Disponible");

}

async function noDisponible(){

await fetch("/trips/chofer/disponibilidad",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
dni:tripActual?.chofer?.dni,
disponible:false
})
});

alert("No disponible");

}

// 🔹 INIT
cargarViaje();

</script>

</body>
</html>
