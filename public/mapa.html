<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Mapa Logístico</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

#mapa{
height:500px;
width:100%;
border-radius:10px;
}
</style>

</head>

<body>

<h2>🗺️ Mapa Logístico</h2>

<div id="mapa"></div>

<script>

// 🔹 MAPA BASE
let mapa = L.map("mapa").setView([-34.6,-58.4],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{ maxZoom:19 }
).addTo(mapa);

// 🔹 ICONO CAMIÓN (FIX REAL)
const camionIcon = L.icon({
iconUrl:"https://cdn-icons-png.flaticon.com/512/1995/1995470.png",
iconSize:[35,35]
});

// 🔹 ARRAYS PARA CONTROLAR MARCADORES
let cargasMarkers = [];
let camiones = {};

// 🔹 CARGAS PUBLICADAS (FIX)
async function cargarMapaCargas(){

try{

// 🔥 usar endpoint correcto
const res = await fetch("/trips/mapa-cargas");
const cargas = await res.json();

// limpiar anteriores
cargasMarkers.forEach(m=>mapa.removeLayer(m));
cargasMarkers = [];

cargas.forEach(c=>{

if(!c.lat || !c.lng) return;

const marker = L.marker([c.lat, c.lng])
.addTo(mapa)
.bindPopup(`
📦 ${c.producto || "-"}<br>
💰 $${c.valor}
`);

cargasMarkers.push(marker);

});

}catch(err){
console.error("Error cargando cargas:", err);
}

}

// 🔹 CAMIONES EN TIEMPO REAL
async function cargarCamiones(){

try{

const res = await fetch("/trips");
const viajes = await res.json();

viajes.forEach(v=>{

if(!v.ultimaUbicacion) return;

const lat = v.ultimaUbicacion.lat;
const lng = v.ultimaUbicacion.lng;

// crear o actualizar
if(!camiones[v._id]){

camiones[v._id] = L.marker(
[lat,lng],
{icon:camionIcon}
).addTo(mapa);

camiones[v._id].bindPopup(
"🚛 " + (v.chofer?.nombre || "Chofer")
);

}else{

camiones[v._id].setLatLng([lat,lng]);

}

});

}catch(err){
console.error("Error camiones:", err);
}

}

// 🔹 INICIO
cargarMapaCargas();
cargarCamiones();

// 🔁 REFRESH
setInterval(cargarCamiones, 3000);

</script>

</body>
</html>
