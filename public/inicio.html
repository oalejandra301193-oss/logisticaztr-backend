<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logística ZTR - Bienvenido</title>
  
  <!-- Iconos modernos para refinar el diseño -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    /* Reset e inicialización de pantalla */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #090d16; /* Fondo oscuro moderno en PC */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* 📱 CONTENEDOR CON TAMAÑO FIJO DE CELULAR */
    .celular-container {
      width: 100%;
      max-width: 400px; /* Ancho real de smartphone moderno */
      height: 760px;    /* Proporción móvil vertical */
      max-height: 92vh; /* Evita desbordes si la pantalla de la PC es muy chica */
      background: #111827; /* Gris azulado profundo mate */
      border-radius: 28px; /* Esquinas redondeadas estilo celular premium */
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); /* Sombra pesada */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 35px 25px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Efecto de luces de fondo (Glow sutil en las esquinas inferiores) */
    .celular-container::before {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(37, 99, 235, 0.15);
      bottom: -50px;
      right: -50px;
      border-radius: 50%;
      filter: blur(40px);
      z-index: 1;
    }

    /* Bloque Superior: Identidad de Marca */
    .header-branding {
      text-align: center;
      margin-top: 40px;
      z-index: 2;
    }

    .logo-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      width: 80px;
      height: 80px;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
    }

    .logo-badge i {
      font-size: 38px;
      color: white;
    }

    h1 {
      color: white;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .sub {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 6px;
      font-weight: 400;
    }

    /* Bloque Central: Botones principales de acceso */
    .buttons-group {
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Estilo común de botones móviles */
    .btn-perfil {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-perfil i {
      font-size: 18px;
    }

    /* Botón Cliente - Modernizado */
    .cliente {
      background: #10b981; /* Verde esmeralda */
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .cliente:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
    }

    /* Botón Chofer - Modernizado */
    .chofer {
      background: #3b82f6; /* Azul brillante */
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }

    .chofer:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
    }

    .btn-perfil:active {
      transform: translateY(1px);
    }

    /* Bloque Inferior: Panel administrativo discreto */
    .footer-section {
      text-align: center;
      z-index: 2;
    }

    .admin {
      background: transparent;
      color: #6b7280;
      border: 1px solid #374151;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .admin:hover {
      background: #1f2937;
      color: white;
      border-color: #4b5563;
    }
  </style>
</head>
<body>

  <!-- 📱 CONTENEDOR VIRTUAL DE SMARTPHONE -->
  <div class="celular-container">
    
    <!-- Superior: Identidad visual -->
    <div class="header-branding">
      <div class="logo-badge">
        <i class="fa-solid fa-truck-fast"></i>
      </div>
      <h1>LOGÍSTICA ZTR</h1>
      <div class="sub">Plataforma logística inteligente</div>
    </div>

    <!-- Centro: Botones de acceso de aplicación móvil -->
    <div class="buttons-group">
      <button class="btn-perfil cliente" onclick="window.location='/login-cliente.html'">
        <i class="fa-solid fa-briefcase"></i> Ingresar como Cliente
      </button>

      <button class="btn-perfil chofer" onclick="window.location='/login-chofer.html'">
        <i class="fa-solid fa-id-card"></i> Ingresar como Chofer
      </button>
    </div>

    <!-- Inferior: Panel Técnico -->
    <div class="footer-section">
      <button class="admin" onclick="window.location='/login.html'">
        <i class="fa-solid fa-lock-open"></i> Panel Admin
      </button>
    </div>

  </div>

</body>
</html>
