<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Cargas publicadas</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

h2{
margin-bottom:20px;
}

.card{

background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:10px;

}

button{

padding:8px 12px;
margin-top:8px;
margin-right:5px;
border:none;
border-radius:6px;
cursor:pointer;

}

.ver{
background:#2563eb;
color:white;
}

.eliminar{
background:#dc2626;
color:white;
}

.estado{

padding:4px 8px;
border-radius:5px;
font-size:12px;
margin-left:10px;

}

.publicado{background:#334155}
.en_viaje{background:#16a34a}
.finalizado{background:#64748b}

</style>

</head>

<body>

<h2>📦 Cliente</h2>

<br>

<button onclick="window.location='registro-cliente.html'">
Registarme como cliente
</button>

<button onclick="mostrarFormulario()">
Publicar carga
</button>

<button onclick="verViaje()">
Ver carga en viaje
</button>

<div id="contenido"></div>

<h3>Publicar carga</h3>

<div class="card">

<input id="producto" placeholder="Producto"><br><br>

<input id="origen" placeholder="Ciudad de origen"><br><br>

<input id="destino" placeholder="Ciudad de destino"><br><br>

<input id="distancia" placeholder="Distancia KM" readonly><br><br>

<input id="valor" placeholder="Valor del viaje"><br><br>

<select id="tipoCarga">

<option value="granel">Granel</option>
<option value="bolsas">Mercadería embolsada</option>
<option value="pallet">Palletizada</option>
<option value="general">Carga general</option>
<option value="pie">Tabla por pie</option>

</select>

<br><br>

<input id="cantidad" placeholder="Cantidad (toneladas / bultos / pallets / pies)">


<button onclick="calcularDistancia()">Calcular distancia</button>

<button onclick="calcularFlete()">
Calcular flete
</button>

<button onclick="crearCarga()">Publicar carga</button>

<button onclick="pagarAdelanto()">
Pagar adelanto
</button>

<div id="lista"></div>


</div>

<h3>Datos del cliente</h3>

<div class="card">

<input id="nombreApellido" placeholder="Nombre y apellido"><br><br>

<input id="comercio" placeholder="Nombre del comercio"><br><br>

<input id="cuit" placeholder="CUIT"><br><br>

<input id="telefono" placeholder="Teléfono"><br><br>

<input id="direccionDescarga" placeholder="Dirección de descarga"><br><br>

<input id="direccionCarga" placeholder="Dirección de Carga"><br><br>

</div>


<script>

async function pagarAdelanto(){

const id = prompt("ID del viaje");

const monto = prompt("Monto del adelanto");

await fetch("/trips/adelanto/"+id,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
monto
})

});

alert("Adelanto registrado");

}

async function cargarCargas(){

const res = await fetch("/trips")
const cargas = await res.json()

let html=""

cargas.forEach(c=>{

let estadoClass="publicado"

if(c.estado==="EN_VIAJE"){
estadoClass="en_viaje"
}

if(c.estado==="FINALIZADO"){
estadoClass="finalizado"
}

html+=`

<div class="card">

<b>Producto:</b> ${c.producto}

<br>

<b>Origen:</b> ${c.origen}

<br>

<b>Destino:</b> ${c.destino}

<br>

<b>Distancia:</b> ${c.distanciaKm || "-"} km

<br>

<b>Precio:</b> $${c.valor || "-"}

<br>

<b>Estado:</b>
<span class="estado ${estadoClass}">
${c.estado || "PUBLICADO"}
</span>

<br><br>

<b>Chofer:</b>
${c.choferNombre || "Sin asignar"}

<br><br>

<button class="ver" onclick="verPostulaciones('${c._id}')">
Ver postulaciones
</button>

<button class="eliminar" onclick="eliminarCarga('${c._id}')">
Eliminar carga
</button>

</div>

`

})

document.getElementById("lista").innerHTML=html

}

cargarCargas()

async function eliminarCarga(id){

if(!confirm("Eliminar carga?")) return

await fetch("/trips/"+id,{
method:"DELETE"
})

cargarCargas()

}

async function crearCarga(){

const producto = document.getElementById("producto").value
const origen = document.getElementById("origen").value
const destino = document.getElementById("destino").value
const distancia = document.getElementById("distancia").value
const valor = document.getElementById("valor").value
const tipo = document.getElementById("tipoCarga").value
const cantidad = document.getElementById("cantidad").value

const nombre = document.getElementById("nombreApellido").value
const comercio = document.getElementById("comercio").value
const cuit = document.getElementById("cuit").value
const telefono = document.getElementById("telefono").value
const direccionDescarga = document.getElementById("direccionDescarga").value
const direccionCarga = document.getElementById("direccionCarga").value


// VALIDACIÓN

if(!producto ||
   !origen ||
   !destino ||
   !distancia ||
   !valor ||
   !tipo ||
   !cantidad ||
   !nombre ||
   !comercio ||
   !cuit ||
   !telefono ||
   !direccionCarga ||
   !direccionDescarga){

alert("⚠ Debe completar todos los datos para publicar la carga")

return

}


// CREAR OBJETO

const data = {

producto,
origen,
destino,
distanciaKm:distancia,
valor,
tipoCarga:tipo,
cantidad,

clienteNombre:nombre,
clienteComercio:comercio,
clienteCUIT:cuit,
clienteTelefono:telefono,
direccionDescarga:direccion,
direccionCarga:direccion

}


// ENVIAR AL SERVIDOR

await fetch("/trips",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})

alert("✅ Carga enviada para aprobación")

cargarCargas()

}

async function verPostulaciones(id){

const res = await fetch("/trips/"+id+"/postulaciones")
const postulaciones = await res.json()

if(postulaciones.length===0){

alert("No hay choferes postulados")

return

}

let texto="Choferes postulados:\n\n"

postulaciones.forEach(p=>{

texto+=p.nombre+" - "+p.telefono+"\n"

})

alert(texto)

}

async function calcularDistancia(){

const origen = document.getElementById("origen").value
const destino = document.getElementById("destino").value

if(!origen || !destino){
alert("Ingrese origen y destino")
return
}

const res = await fetch(`/trips/distancia?origen=${origen}&destino=${destino}`)
const data = await res.json()

document.getElementById("distancia").value = data.km

}

function calcularFlete(){

const km = parseFloat(document.getElementById("distancia").value)
const tipo = document.getElementById("tipoCarga").value
const cantidad = parseFloat(document.getElementById("cantidad").value)

if(!km){
alert("Primero calcule la distancia")
return
}

let tarifa = 0

if(tipo === "granel") tarifa = 120
if(tipo === "bolsas") tarifa = 140
if(tipo === "pallet") tarifa = 160
if(tipo === "general") tarifa = 150
if(tipo === "pie") tarifa = 20

const precio = km * tarifa * (cantidad || 1)

document.getElementById("valor").value = Math.round(precio)

}

</script>

</body>

</html>
