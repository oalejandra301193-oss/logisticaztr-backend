<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>App Chofer ZTR</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin:10px 0;
border-radius:10px;
}

input{
display:block;
margin:5px 0;
padding:8px;
}

button{
padding:10px;
margin-top:10px;
}
</style>
</head>

<body>

<h2>🚛 App Chofer</h2>

<h3>Mi perfil</h3>

<div id="formPerfil">
<input id="nombre" placeholder="Nombre">
<input id="apellido" placeholder="Apellido">
<input id="dni" placeholder="DNI">
<input id="telefono" placeholder="Teléfono">
<input id="patente1" placeholder="Patente 1">
<input id="patente2" placeholder="Patente 2">
<input id="patente3" placeholder="Patente 3">
<button onclick="guardarPerfil()">Guardar perfil</button>
</div>

<h3>Foto</h3>
<input type="file" id="foto">
<button onclick="subirFoto()">Subir foto</button>

<div id="miPerfil"></div>

<h3>📦 Cargas disponibles</h3>
<div id="lista"></div>

<div id="mapa" style="height:300px;"></div>

<script>

let mapa;
let markers = [];

// 🔹 UBICACIÓN
navigator.geolocation.getCurrentPosition(pos=>{
localStorage.setItem("lat", pos.coords.latitude);
localStorage.setItem("lng", pos.coords.longitude);
});

// 🔹 MAPA
function iniciarMapa(lat,lng){

mapa = L.map("mapa").setView([lat,lng],10);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19
}).addTo(mapa);

L.marker([lat,lng]).addTo(mapa).bindPopup("Tu ubicación");

}

// 🔹 DISTANCIA REAL (km)
function distancia(lat1,lng1,lat2,lng2){

const R=6371;

const dLat=(lat2-lat1)*Math.PI/180;
const dLng=(lng2-lng1)*Math.PI/180;

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLng/2)*Math.sin(dLng/2);

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

}

// 🔹 CARGAR PERFIL
async function mostrarPerfil(){

const id = localStorage.getItem("choferId");
if(!id) return;

const res = await fetch("/choferes/"+id);
const d = await res.json();

localStorage.setItem("nombre", d.nombre || "");
localStorage.setItem("telefono", d.telefono || "");
localStorage.setItem("dni", d.dni || "");
localStorage.setItem("patente1", d.patente1 || "");

document.getElementById("miPerfil").innerHTML=`
<div class="card">
<b>${d.nombre || ""} ${d.apellido || ""}</b><br>
📞 ${d.telefono || "-"}
</div>
`;

}

// 🔹 GUARDAR PERFIL
async function guardarPerfil(){

const id = localStorage.getItem("choferId");

const data={
nombre: nombre.value,
apellido: apellido.value,
dni: dni.value,
telefono: telefono.value,
patente1: patente1.value,
patente2: patente2.value,
patente3: patente3.value
};

const res = await fetch("/choferes/"+id+"/perfil",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

if(res.ok){
alert("Perfil guardado");
location.reload();
}

}

// 🔹 CARGAR CARGAS
async function cargarCargas(){

const res = await fetch("/trips");
const viajes = await res.json();

const lat = Number(localStorage.getItem("lat"));
const lng = Number(localStorage.getItem("lng"));

let lista = [];

viajes.forEach(v=>{

if(v.estado === "PUBLICADO" && v.origenLat){

const dist = distancia(
lat,lng,
v.origenLat,
v.origenLng
);

lista.push({...v,distancia:dist});

}

});

// ordenar
lista.sort((a,b)=>a.distancia - b.distancia);

// limpiar mapa
markers.forEach(m=>mapa.removeLayer(m));
markers=[];

let html="";

lista.forEach(v=>{

// mapa
const marker = L.marker([v.origenLat,v.origenLng])
.addTo(mapa)
.bindPopup("📦 Carga disponible");

markers.push(marker);

// html
html+=`
<div class="card">

📦 ${v.producto}<br>
📍 Zona aproximada<br>
💰 $${v.valor}<br>
📏 ${v.distancia.toFixed(1)} km<br>

<button onclick="postular('${v._id}')">
Postularme
</button>

</div>
`;

});

document.getElementById("lista").innerHTML = html;

}

// 🔹 POSTULAR
async function postular(id){

const res = await fetch("/trips/postular/"+id,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nombre: localStorage.getItem("nombre"),
telefono: localStorage.getItem("telefono"),
dni: localStorage.getItem("dni"),
patente1: localStorage.getItem("patente1")
})
});

if(res.ok){
alert("Postulación enviada");
}

}

// 🔹 FOTO
async function subirFoto(){

const input = document.getElementById("foto");

if(!input.files[0]){
alert("Seleccioná una foto");
return;
}

const formData = new FormData();
formData.append("archivo", input.files[0]);

const id = localStorage.getItem("choferId");

const res = await fetch("/choferes/"+id+"/foto",{
method:"POST",
body:formData
});

if(res.ok){
alert("Foto subida");
location.reload();
}

}

// 🔹 INIT
navigator.geolocation.getCurrentPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

iniciarMapa(lat,lng);
cargarCargas();

});

mostrarPerfil();

</script>

</body>
</html>
