<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cargas pendientes</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

button{
padding:6px 10px;
margin-top:10px;
margin-right:5px;
border:none;
border-radius:6px;
cursor:pointer;
}

.aprobar{background:#16a34a;color:white;}
.rechazar{background:#dc2626;color:white;}
</style>

</head>

<body>

<h2>📦 Cargas pendientes de aprobación</h2>

<div id="lista"></div>

<script>

async function cargar(){

const res = await fetch("https://logisticaztr-backend.onrender.com/trips")
const viajes = await res.json()

let html=""

viajes.forEach(v=>{

if(v.estado === "PENDIENTE"){

html += `
<div class="card">

<b>${v.producto}</b><br>
${v.origen} → ${v.destino}<br>
💰 $${v.valor}<br>

👤 ${v.clienteNombre || "-"}

<br>

<button class="aprobar" onclick="aprobar('${v._id}')">
Aprobar
</button>

<button class="rechazar" onclick="rechazar('${v._id}')">
Rechazar
</button>

</div>
`
}

})

document.getElementById("lista").innerHTML = html

}

async function aprobar(id){

await fetch("/trips/"+id+"/aprobar",{method:"POST"})
cargar()

}

async function rechazar(id){

await fetch("/trips/eliminar/"+id,{method:"POST"})
cargar()

}

cargar()

</script>

</body>
</html>
