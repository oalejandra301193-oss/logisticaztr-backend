<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Panel de Despacho</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
  margin: 0;
}

.contenedor-despacho {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  height: calc(100vh - 100px);
}

#info {
  flex: 1;
  overflow-y: auto;
  padding-right: 10px;
}

#mapa{
  flex: 2;
  border-radius:10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.panel{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  border-left: 5px solid #2563eb;
}

button{
  padding:8px 12px;
  margin-top:10px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}
</style>

</head>

<body>

<h2>🚚 Panel de Control y Despacho Inteligente</h2>

<div class="contenedor-despacho">
  <!-- Columna izquierda: Cargas Disponibles -->
  <div id="info">Cargando datos de logística...</div>
  
  <!-- Columna derecha: Mapa Integrado -->
  <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let mapa = L.map("mapa").setView([-34.6,-58.4],5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19
}).addTo(mapa);

// Estructuras para actualizar elementos dinámicamente sin reiniciar el mapa
let marcadoresCargas = {};
let marcadoresCamiones = {};

// Icono personalizado para diferenciar Cargas de Camiones (Opcional, Leaflet usa azul por defecto)
// Creamos un filtro rápido usando popups
async function cargarPanel(){
  try{
    const resTrips = await fetch("/trips/mapa-cargas");
    const trips = await resTrips.json();

    const resDrivers = await fetch("/drivers");
    const drivers = await resDrivers.json();

    let html = "";
    let idsCargasNuevas = new Set();
    let idsChoferesNuevos = new Set();

    // 📦 1. PROCESAR CARGAS PUBLICADAS
    trips.forEach(t=>{
      if(!t.lat || !t.lng) return;
      idsCargasNuevas.add(t.id);

      const latCarga = parseFloat(t.lat);
      const lngCarga = parseFloat(t.lng);

      if(!marcadoresCargas[t.id]) {
        const marker = L.marker([latCarga, lngCarga]).addTo(mapa);
        marker.bindPopup(`<b>📦 Carga:</b> ${t.producto}<br><b>Valor:</b> $${t.valor}`);
        marcadoresCargas[t.id] = marker;
      }

      html += `
        <div class="panel">
          📦 <b>${t.producto}</b><br>
          💰 Valor flete: $${t.valor}<br>
          <button onclick="sugerir(${latCarga},${lngCarga}, '${t.producto}')">
            🔍 Buscar chofer más cercano (Ruta Real)
          </button>
        </div>
      `;
    });

    // 🚛 2. PROCESAR CHOFERES EN TIEMPO REAL
    drivers.forEach(d=>{
      if(!d.ultimaUbicacion || !d.ultimaUbicacion.lat || !d.ultimaUbicacion.lng) return;
      idsChoferesNuevos.add(d._id);

      const latDriver = parseFloat(d.ultimaUbicacion.lat);
      const lngDriver = parseFloat(d.ultimaUbicacion.lng);

      if(marcadoresCamiones[d._id]) {
        marcadoresCamiones[d._id].setLatLng([latDriver, lngDriver]);
      } else {
        const marker = L.marker([latDriver, lngDriver]).addTo(mapa);
        marker.bindPopup(`<b>🚛 Camión:</b> ${d.nombre || "Chofer"}<br><b>Estado:</b> ${d.disponible ? "Disponible" : "Ocupado"}`);
        marcadoresCamiones[d._id] = marker;
      }
    });

    // 3. LIMPIEZA DE ELEMENTOS VIEJOS
    for(let id in marcadoresCargas) {
      if(!idsCargasNuevas.has(id)) { mapa.removeLayer(marcadoresCargas[id]); delete marcadoresCargas[id]; }
    }
    for(let id in marcadoresCamiones) {
      if(!idsChoferesNuevos.has(id)) { mapa.removeLayer(marcadoresCamiones[id]); delete marcadoresCamiones[id]; }
    }

    if(html === "") html = "<p>No hay cargas publicadas para despachar</p>";
    document.getElementById("info").innerHTML = html;

  }catch(err){
    console.error("❌ Error actualizando panel de despacho:", err);
  }
}

// 🌐 CONEXIÓN CON API VIAL ASÍNCRONA (OSRM)
async function calcularDistanciaRutaReal(lat1, lon1, lat2, lon2) {
  try {
    const url = `https://project-osrm.org{lon1},${lat1};${lon2},${lat2}?overview=false`;
    const response = await fetch(url);
    const data = await response.json();
    if (data.code === "Ok" && data.routes && data.routes.length > 0) {
      return data.routes[0].distance / 1000; // Devuelve kilómetros exactos por carretera
    }
    return 99999;
  } catch (error) {
    return 99999;
  }
}

// 🔍 SUGERIR MEJOR CHOFER POR RUTA TERRESTRE
async function sugerir(cargaLat, cargaLng, productoName){
  alert(`Buscando el camión ideal por carretera para la carga de: ${productoName}.\nPor favor, aguarde un instante mientras calculamos las rutas...`);

  const res = await fetch("/drivers");
  const drivers = await res.json();

  let mejorChofer = null;
  let mejorDistanciaVial = 99999;

  // Ejecutamos las consultas de carretera una por una para evaluar el asfalto real
  for (const d of drivers) {
    if (d.disponible && d.ultimaUbicacion && d.ultimaUbicacion.lat && d.ultimaUbicacion.lng) {
      
      const distCarretera = await calcularDistanciaRutaReal(
        cargaLat, 
        cargaLng, 
        parseFloat(d.ultimaUbicacion.lat), 
        parseFloat(d.ultimaUbicacion.lng)
      );

      if (distCarretera < mejorDistanciaVial) {
        mejorDistanciaVial = distCarretera;
        mejorChofer = d;
      }
    }
  }

  if (mejorChofer && mejorDistanciaVial < 99999) {
    alert(`🎯 ¡Chofer ideal encontrado por carretera!\n\n🚛 Nombre: ${mejorChofer.nombre}\n🪪 DNI: ${mejorChofer.dni}\n📏 Distancia real por ruta: ${mejorDistanciaVial.toFixed(1)} km`);
  } else {
    alert("❌ No se encontraron choferes disponibles con ubicaciones válidas en este momento.");
  }
}

// Actualizaciones de monitoreo estables cada 10 segundos
setInterval(cargarPanel, 10000);
cargarPanel();

</script>

</body>
</html>
