<h2>📡 Centro de Operaciones</h2>

<div id="resumen"></div>

<script>

async function cargar(){

const res = await fetch("/trips");

const viajes = await res.json();

let activos=0;
let disponibles=0;

viajes.forEach(v=>{

if(v.estado==="EN_VIAJE") activos++;

if(v.estado==="PENDIENTE") disponibles++;

});

document.getElementById("resumen").innerHTML=`

🚚 Viajes activos: ${activos}

<br><br>

📦 Cargas disponibles: ${disponibles}

<br><br>

<button onclick="window.location='mapa.html'">
Ver mapa en vivo
</button>

`;

}

cargar()

setInterval(verificar,5000)

async function verificar(){

const res = await fetch("/trips");

const viajes = await res.json();

viajes.forEach(v=>{

if(v.estado==="PENDIENTE"){

console.log("Carga sin chofer:",v.producto)

}

})

}


</script>
